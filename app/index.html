  //     Status, ..., Nome, ..., Volume, ..., Placa, Material, Descrição Complementar.
  //  2) Sem cabeçalho, com 23 colunas ou mais — mesmo layout do SEFAZ, em posição fixa.
  //  3) Antigo, sem cabeçalho: Número, Emissão, Fornecedor, Material, Pedido, Placa, Usina[, Descrição].
  // "Número" vem como "430652/0" (número/série): a série é descartada pra casar com o Documento da PUZL.
  // Status "Cancelada" e notas emitidas pela própria Concrelagos (transferência) entram só pra registro.
  var NF_LAYOUT_SEFAZ = { CHAVE:0, NUMERO:1, EMISSAO:2, STATUS:3, CNPJ:5, NOME:6, VOLUME:12, TRANSPORTADOR:18, PLACA:20, MATERIAL:21, DESCRICAOCOMPLEMENTAR:22 };
  var NF_LAYOUT_ANTIGO = { NUMERO:0, EMISSAO:1, FORNECEDOR:2, MATERIAL:3, PEDIDO:4, PLACA:5, USINA:6, DESCRICAOCOMPLEMENTAR:7 };
  function nfFornecedorCimenteiro(nome){
    var n = String(nome || "");
    return SEFAZ_PARSERS.some(function(r){ return r.match.test(n); }) || /CIMENT|CIRCLUA|VITTORIA/i.test(n);
  }
  function importNFesFromText(text){
    ignoradasUltima = [];
    var existing = {};
    cementNFes.forEach(function(nf){ existing[nfKey(nf)] = nf; });
    var added = 0, skipped = 0, invalid = 0, naoCimento = 0, atualizadas = 0, canceladas = 0, transferencias = 0;
    var cols = null;
    var hn = function(s){ return stripAccents(String(s || "")).toUpperCase().replace(/[^A-Z0-9]/g, ""); };
    String(text || "").split(/\r?\n/).forEach(function(line){
      line = line.replace(/\s+$/, "");
      if (!line.trim()) return;
      var parts = line.indexOf("\t") !== -1 ? line.split("\t") : line.split(/[;,]/);
      parts = parts.map(function(p){ return p.trim(); });
      var norm = parts.map(hn);
      if (norm.indexOf("NUMERO") !== -1 && norm.indexOf("MATERIAL") !== -1 && norm.indexOf("EMISSAO") !== -1){
        cols = {}; norm.forEach(function(n, i){ if (n && cols[n] == null) cols[n] = i; });   // linha de cabeçalho
        return;
      }
      var lay = cols || (parts.length >= 23 ? NF_LAYOUT_SEFAZ : NF_LAYOUT_ANTIGO);
      var g = function(){
        for (var i = 0; i < arguments.length; i++){ var ix = lay[arguments[i]]; if (ix != null && parts[ix] != null && parts[ix] !== "") return parts[ix]; }
        return "";
      };
      var numeroBruto = g("NUMERO");
      if (!numeroBruto || (!cols && parts.length < 2)){ invalid++; ign("Linha sem número da nota ou com poucas colunas", line); return; }
      var numero = numeroBruto.split("/")[0].trim();
      if (!numero){ invalid++; ign("Linha sem número da nota", line); return; }
      var status = /cancel/i.test(g("STATUS")) ? "Cancelada" : "Autorizada";
      var nf = { id:0, numero: numero, emissao: normalizeDateToISO(g("EMISSAO")), fornecedor: g("NOME", "FORNECEDOR"), material: g("MATERIAL"), pedido: g("PEDIDO"), placa: g("PLACA"), usina: g("USINA"), motorista:"", chave: g("CHAVE"), status: status, tipo: "compra" };
      // transferência: emitida pela própria Concrelagos (nome ou CNPJ de uma usina cadastrada)
      if (/CONCRELAGOS/i.test(nf.fornecedor) || usinaByCnpj(g("CNPJ"))) nf.tipo = "transferencia";
      var puzlMatch = puzlMatchParaNF(nf);
      var ehCimento = materialEhCimento(nf.material) || (puzlMatch && materialEhCimento(puzlMatch.item));
      // nota cancelada costuma vir sem material: se é de um cimenteiro conhecido, registra mesmo assim
      if (!ehCimento && status === "Cancelada" && !nf.material && nfFornecedorCimenteiro(nf.fornecedor)) ehCimento = true;
      if (!ehCimento){
        naoCimento++;
        ign(materialExcluido(nf.material) ? "Material na lista de exceções do catálogo: " + nf.material : "Material fora do Catálogo de Cimentos: " + (nf.material || "(vazio)"), line);
        return;
      }
      var descricaoComplementar = g("DESCRICAOCOMPLEMENTAR");
      if (descricaoComplementar && (!nf.pedido || !nf.placa || !nf.usina)){
        var extraido = extractFromDescricao(nf.fornecedor, descricaoComplementar);
        if (!nf.pedido && extraido.pedido) nf.pedido = extraido.pedido;
        if (!nf.placa && extraido.placa) nf.placa = extraido.placa;
        if (!nf.usina && extraido.usina) nf.usina = extraido.usina;
      }
      var key = nfKey(nf);
      var ja = existing[key];
      if (ja){
        // reimportação: se a nota já existia e agora veio cancelada, só atualiza o status
        if (status === "Cancelada" && ja.status !== "Cancelada"){ ja.status = "Cancelada"; atualizadas++; return; }
        skipped++; ign("Nota repetida: " + nf.numero + (ja.fornecedor ? " (já cadastrada de " + ja.fornecedor + ")" : ""), line); return;
      }
      existing[key] = nf;
      nf.id = ++nfSeq;
      cementNFes.push(nf);
      added++;
      if (status === "Cancelada") canceladas++;
      if (nf.tipo === "transferencia") transferencias++;
    });
    return {added:added, skipped:skipped, invalid:invalid, naoCimento:naoCimento, atualizadas:atualizadas, canceladas:canceladas, transferencias:transferencias, materiaisNovos:computeMateriaisNovosPendentes().length};
  }

  // Lê o arquivo (.xlsx/.xls/.csv) escolhido/arrastado no dropzone e devolve
  // texto separado por TAB, no mesmo formato que os parsers de importação já
  // esperam (o mesmo que sai ao copiar células do Excel e colar na caixa de
  // texto) — assim a importação por arquivo usa exatamente a mesma lógica de
  // parsing que a colagem manual, sem duplicar regra nenhuma. Usa a
  // biblioteca SheetJS (XLSX), embutida no próprio arquivo, então funciona
  // offline, sem depender de internet.
  function readSpreadsheetFile(file, cb){
    if (!file) return;
    if (typeof XLSX === "undefined"){ cb(null, "Biblioteca de planilha não carregou — tente colar o conteúdo manualmente."); return; }
    var isCsv = /\.csv$/i.test(file.name);
    var reader = new FileReader();
    reader.onerror = function(){ cb(null, "Não foi possível ler o arquivo."); };
    reader.onload = function(e){
      try {
        var wb = isCsv
          ? XLSX.read(String(e.target.result || ""), {type:"string"})
          : XLSX.read(new Uint8Array(e.target.result), {type:"array"});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        if (!isCsv) Object.keys(sheet).forEach(function(addr){
          if (addr.charAt(0) === "!") return;
          var c = sheet[addr];
          if (c && c.t === "s" && typeof c.v === "string" && /[\t\r\n"]/.test(c.v)){ c.v = c.v.replace(/[\t\r\n]+/g, " ").replace(/"/g, "'"); c.w = c.v; return; }   // texto com tab/quebra/aspas não quebra a linha
          if (!c || c.t !== "n" || typeof c.v !== "number") return;
          var v = c.v, txt;
          if (Math.floor(v) === v) txt = String(v);                          // inteiro (documento, nº, data em série): sem formato de data
          else if (v > 20000 && v < 60000) txt = String(Math.floor(v));       // data com hora: só o dia
          else txt = String(Math.round(v * 1e6) / 1e6).replace(".", ",");     // decimal à brasileira
          c.w = txt;
        });
        var tsv = XLSX.utils.sheet_to_csv(sheet, {FS:"\t", blankrows:false});
        cb(tsv);
      } catch(err){
        cb(null, "Erro ao ler a planilha: " + (err && err.message ? err.message : err));
      }
    };
    if (isCsv) reader.readAsText(file, "utf-8"); else reader.readAsArrayBuffer(file);
  }
  // Liga um dropzone (label + input[type=file] escondido) tanto a arrastar-
  // e-soltar quanto a clicar pra escolher — em ambos os casos, lê o arquivo
  // de verdade (via readSpreadsheetFile) e chama onFile(tsv, nomeDoArquivo);
  // em caso de erro de leitura, onError(msg).
  function wireFileDropzone(labelId, inputId, onFile, onError){
    var label = el(labelId).closest(".import-dropzone");
    var input = el(inputId);
    function handleFile(file){
      if (!file) return;
      readSpreadsheetFile(file, function(tsv, err){
        if (err){ onError(err); return; }
        onFile(tsv, file.name);
      });
    }
    input.addEventListener("change", function(){
      var f = this.files && this.files[0];
      if (f) handleFile(f);
    });
    label.addEventListener("dragover", function(e){ e.preventDefault(); label.classList.add("dragover"); });
    label.addEventListener("dragleave", function(){ label.classList.remove("dragover"); });
    label.addEventListener("drop", function(e){
      e.preventDefault();
      label.classList.remove("dragover");
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) handleFile(f);
    });
  }

  // Alerta de materiais possivelmente novos (ver computeMateriaisNovosPendentes):
  // fica visível (não é um <details> escondido — é um alerta) sempre que há
  // algo pendente, com opção de mandar direto pra um fornecedor já cadastrado
  // na Base de Fábricas ou criar um fornecedor novo, ou simplesmente ignorar
  // (nesse caso não alerta de novo pra essa combinação fornecedor+material).
  function renderMateriaisNovos(){
    var cardEl = el("materiaisNovosCard");
    if (!cardEl) return;
    function paint(){
      var pendentes = computeMateriaisNovosPendentes();
      if (!pendentes.length){ cardEl.innerHTML = ""; return; }
      var rows = pendentes.map(function(p){
        var sugestao = fabricaEntryForFornecedor(p.fornecedorNF);
        var opts = '<option value="__novo__">— criar fornecedor novo ("'+esc(p.fornecedorNF)+'") —</option>' +
          FABRICAS_CATALOGO.map(function(f, i){

          }).join("");
        var origem = p.viaPuzl ? ' <span class="badge info">via PUZL</span>' : "";
        return '<div class="imp-pend">' +
          '<div class="nm"><b>'+esc(p.fornecedorNF)+'</b>'+origem+'<small>'+esc(p.material)+'</small></div>' +
          '<select data-pid="'+p.id+'" class="status-select">'+opts+'</select>' +

          '<button class="btn-ghost" data-ignpid="'+p.id+'" style="padding:6px 10px;color:var(--text-muted);">Ignorar</button>' +
          '</div>';
      }).join("");
      cardEl.innerHTML =
        '<div class="imp-alert">' +
        '<div class="imp-alert-head"><b>🔔 '+pendentes.length+' material(is) possivelmente novo(s)</b><span>Apareceu numa nota de cimento, mas não está cadastrado para esse fornecedor na Base de Fábricas. Escolha onde cadastrar ou ignore se for só variação de escrita.</span></div>' +
        rows +
        '</div>';
      cardEl.querySelectorAll("[data-addpid]").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = parseInt(btn.dataset.addpid, 10);
          var p = pendentes.find(function(x){ return x.id === id; });
          if (!p) return;
          var sel = cardEl.querySelector('select[data-pid="'+id+'"]');
          var val = sel.value;
          var fab;
          if (val === "__novo__"){
            fab = {fornecedor: p.fornecedorNF, materiais: [], cnpjs: []};
            FABRICAS_CATALOGO.push(fab);
          } else {
            fab = FABRICAS_CATALOGO[parseInt(val, 10)];
          }
          if (fab && !fab.materiais.some(function(m){ return normalizeMaterial(m) === normalizeMaterial(p.material); })){
            fab.materiais.push(p.material);
          }
          paint();
          renderFabricasCatalogo();
        });
      });
      cardEl.querySelectorAll("[data-ignpid]").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = parseInt(btn.dataset.ignpid, 10);
          var p = pendentes.find(function(x){ return x.id === id; });
          if (!p) return;
          materiaisIgnorados[materialNovoKey(p.fornecedorNF, p.material)] = true;
          paint();
        });
      });
    }
    paint();
  }

        '<div style="display:flex;gap:8px;">' +

  // Base de Usinas: Usina x Sigla x CNPJ x Regional x contatos (WhatsApp/
  // e-mail de usina e regional), nessa ordem — mesma ordem da planilha-modelo
  // "base_cadastro_filiais" usada pela empresa. Código/Filial/Formato PUZL
  // ficam nas colunas finais: não fazem parte do modelo de cadastro da
  // empresa, mas seguem necessários aqui dentro (é o campo "puzl" que bate a
  // usina no formato "32 | CGL | CARANGOLA" contra os Lançamentos PUZL — ver
  // recomputeEntradasFromPuzl). Editável direto na tabela, ou alimentada por
  // arquivo/colar abaixo, igual às outras importações desta tela.
  function importUsinasFromText(text){
    var byCnpj = {}, byNome = {};
    usinasCadastro.forEach(function(u, i){
      if (u.cnpj) byCnpj[normalizeCnpj(u.cnpj)] = i;
      if (u.usina) byNome[normalizeMaterial(u.usina)] = i;
    });
    var added = 0, updated = 0, invalid = 0;
    String(text||"").split(/\r?\n/).forEach(function(line){
      line = line.trim();
      if (!line) return;
      var parts = line.split("\t");
      if (parts.length < 4) { invalid++; return; }
      // Pula a linha de cabeçalho, se vier junto.
      if (/^usina$/i.test((parts[0]||"").trim())) return;
      var u = {
        usina: (parts[0]||"").trim(), sigla: (parts[1]||"").trim(),
        cnpj: (parts[2]||"").trim(), regional: (parts[3]||"").trim(),
        whatsappUsina: (parts[4]||"").trim(), whatsappRegional: (parts[5]||"").trim(),
        emailUsina: (parts[6]||"").trim(), emailRegional: (parts[7]||"").trim()
      };
      if (!u.usina) { invalid++; return; }
      var idx = (u.cnpj && byCnpj[normalizeCnpj(u.cnpj)] !== undefined) ? byCnpj[normalizeCnpj(u.cnpj)]
        : (byNome[normalizeMaterial(u.usina)] !== undefined ? byNome[normalizeMaterial(u.usina)] : -1);
      if (idx >= 0) {
        var alvo = usinasCadastro[idx];
        alvo.usina = u.usina; alvo.sigla = u.sigla || alvo.sigla; alvo.cnpj = u.cnpj || alvo.cnpj;
        alvo.regional = u.regional || alvo.regional;
        alvo.whatsappUsina = u.whatsappUsina; alvo.whatsappRegional = u.whatsappRegional;
        alvo.emailUsina = u.emailUsina; alvo.emailRegional = u.emailRegional;
        updated++;
      } else {
        u.nomeCadastro = u.usina; u.codigo = ""; u.filial = ""; u.puzl = "";
        usinasCadastro.push(u);
        byCnpj[normalizeCnpj(u.cnpj)] = usinasCadastro.length - 1;
        byNome[normalizeMaterial(u.usina)] = usinasCadastro.length - 1;
        added++;
      }
    });
    return {added:added, updated:updated, invalid:invalid};
  }

  // Importação da Programação de Cimento a partir de planilhas antigas
  // (ex: Google Sheets), no MESMO formato em que a programação já aparece
  // na tela/planilha: um cabeçalho "PROGRAMAÇÃO PARA O DIA DD/MM/AAAA (...)"
  // por dia, seguido das linhas Usina / Placa / Fábrica / Pedido. Tolera
  // colar direto do Sheets (células com quebra de linha vêm entre aspas,
  // como várias entregas na mesma linha) — nesse caso, os valores viram
  // "A / B / C", igual ao formato que os campos da Programação já aceitam.
  function parseTsvRows(text){
    var rows = [], row = [], cell = "", inQuotes = false;
    var s = String(text||"");
    for (var i = 0; i < s.length; i++){
      var c = s[i];
      if (inQuotes){
        if (c === '"'){ if (s[i+1] === '"'){ cell += '"'; i++; } else inQuotes = false; }
        else cell += c;
      } else {
        if (c === '"' && cell === "") inQuotes = true;
        else if (c === "\t"){ row.push(cell); cell = ""; }
        else if (c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
        else if (c === "\r"){ /* ignora */ }
        else cell += c;
      }
    }
    row.push(cell); rows.push(row);
    return rows;
  }
  // "***...***" é o jeito que a planilha antiga marca uma usina sem
  // programação naquele dia — vira célula vazia aqui. Múltiplos valores na
  // mesma célula (quebra de linha, entregas diferentes) viram "A / B / C".
  function limpaCelulaProg(v){
    v = String(v||"").split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean).join(" / ").trim();
    if (/^\*+$/.test(v)) return "";
    return v;
  }
  // Palavras que indicam que o trecho é um recado escrito à mão (ex:
  // "DESCARREGAR SEXTA - CARREGAR 18:30"), não uma lista de placas/pedidos —
  // nesse caso o "-" faz parte da frase e NÃO deve separar valores.
  var PROG_NOTA_LIVRE_RE = /\b(CARREGAR|DESCARREGAR|DEFINIR|CONFIRMAR|AGUARDAR|HR|HORAS|PLACA|PED|SEXTA|S[ÁA]BADO|DOMINGO|SEGUNDA|TER[ÇC]A|QUARTA|QUINTA)\b/i;
  // Igual limpaCelulaProg (linha em branco de cada célula vira " / ", "***"
  // vira vazio), mas pensado pro campo Placa/Pedido, onde a planilha às vezes
  // junta mais de um valor na MESMA linha da célula usando "-" como separador
  // (ex: "QQZ4J25 -AWJ5D35" = duas placas, "394522 - 394524" = dois pedidos)
  // em vez de quebra de linha. Cada trecho só é separado no "-" quando não
  // parece um recado escrito à mão (ver PROG_NOTA_LIVRE_RE) — assim frases
  // como "DEFINIR PLACA - DESCARREGAR 26/09" continuam inteiras.
  function limpaMultiPlacaPedido(v){
    var base = limpaCelulaProg(v);
    if (!base) return "";
    var out = [];
    base.split("/").forEach(function(seg){
      seg = seg.trim();
      if (!seg) return;
      if (seg.indexOf("-") !== -1 && !PROG_NOTA_LIVRE_RE.test(seg)){
        seg.split(/\s*-\s*/).forEach(function(x){ x = x.trim(); if (x) out.push(x); });
      } else {
        out.push(seg);
      }
    });
    return out.join(" / ");
  }
  function importProgramacaoFromText(text){
    var byNorm = {};
    MASTER_USINAS.forEach(function(u){ byNorm[normalizeMaterial(u)] = u; });
    var diasSet = {}, atualizadas = 0, novasNaoReconhecidas = 0, linhasIgnoradas = 0;
    var currentISO = null;
    // Colar direto da planilha antiga sempre trazia a Usina na 1ª coluna
    // (índice 0), mas um arquivo .xlsx lido inteiro (via arrastar o arquivo)
    // pode ter colunas extras antes da Usina — ex: checkboxes/flags de
    // conferência ("TRUE"/"FALSE") que o Excel guarda mas não aparecem
    // quando alguém seleciona e copia só a partir da coluna Usina. colOffset
    // detecta isso: acha a coluna real da Usina pela linha de cabeçalho
    // ("Usina/Placa/Fábrica/Pedido") e usa esse deslocamento pro resto do
    // arquivo — sem isso, cada linha era lida a partir da coluna errada
    // (pegando o texto do checkbox como se fosse o nome da usina).
    var colOffset = 0;
    parseTsvRows(text).forEach(function(cells){
      var joined = cells.join(" ");
      var m = /PROGRAMA[ÇC][ÃA]O\s+PARA\s+O\s+DIA\s+(\d{2})\/(\d{2})\/(\d{4})/i.exec(joined);
      if (m){
        currentISO = m[3] + "-" + m[2] + "-" + m[1];
        if (!cementScheduleByDate[currentISO]) cementScheduleByDate[currentISO] = {ref:"", isException:isSunday(fromISO(currentISO)), entries:[]};
        diasSet[currentISO] = true;
        return;
      }
      var headerIdx = cells.findIndex(function(c){ return /^usinas?$/i.test(String(c||"").trim()); });
      if (headerIdx !== -1){ colOffset = headerIdx; return; } // cabeçalho da tabela — também fixa a coluna real da Usina
      var usinaRaw = limpaCelulaProg(cells[colOffset]);
      if (!usinaRaw) return; // linha vazia/separadora, ignora
      if (!currentISO) { linhasIgnoradas++; return; } // linha de dado antes de qualquer cabeçalho de dia
      var placa = limpaMultiPlacaPedido(cells[colOffset+1]);
      var fabrica = limpaCelulaProg(cells[colOffset+2]);
      var pedido = limpaMultiPlacaPedido(cells.slice(colOffset+3).join("\n"));
      var norm = normalizeMaterial(usinaRaw);
      var reconhecida = !!byNorm[norm];
      var usinaFinal = reconhecida ? byNorm[norm] : usinaRaw;
      var day = cementScheduleByDate[currentISO];
      var entry = day.entries.find(function(e){ return normalizeMaterial(e.usina || "") === norm; });
      if (!entry){
        entry = {usina: usinaFinal, carretas:"", fabrica:"", pedido:"", obs:""};
        if (!reconhecida){ entry.__key = "extra-import-" + Date.now() + "-" + Math.random().toString(36).slice(2,7); novasNaoReconhecidas++; }
        day.entries.push(entry);
      }
      if (placa || fabrica || pedido) atualizadas++;
      if (placa) entry.carretas = placa;
      if (fabrica) entry.fabrica = fabrica;
      if (pedido) entry.pedido = pedido;
    });
    return {dias: Object.keys(diasSet).length, atualizadas: atualizadas, novasNaoReconhecidas: novasNaoReconhecidas, linhasIgnoradas: linhasIgnoradas};
  }

          '<label class="import-dropzone" for="usinasFileInput" style="margin-bottom:8px;"><span class="icon">⬆️</span><span id="usinasFileLabel">Arraste ou clique para selecionar</span></label>' +

  var nfesListOpen = true;

      '<div class="card" style="margin-top:8px;">' +
      '<p class="import-card-desc" style="margin:0 0 10px;">'+(function(){ var c = cementNFes.filter(nfCancelada).length, t = cementNFes.filter(nfTransf).length; return (c ? '<b style="color:var(--danger);">'+c+' nota(s) CANCELADA(S)</b> (vermelho) e ' : '') + (t ? '<b>'+t+' transferência(s)</b> (azul) estão aqui só pra registro — não entram nas conferências. ' : (c ? 'estão aqui só pra registro. ' : '')); })()+'A coluna <b>Material (PUZL)</b> é o item confirmado por cruzamento com Lançamentos (PUZL) pelo nº do Documento/NF — mais confiável que o texto cru do SEFAZ, principalmente pra distinguir pozolana.</p>' +
      (cementNFes.length
        ? '<div class="table-wrap"><table><thead><tr><th>Número</th><th>Emissão</th><th>Fornecedor</th><th>Material (SEFAZ)</th><th>Material (PUZL)</th><th>Pedido</th><th>Placa</th><th>Motorista</th><th>Usina</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'

  function paintBaseDadosStats(){
    var el2 = el("baseDadosStats");
    if (!el2) return;
    var comDoc = cementEntradas.filter(function(en){ return String(en.documento||"").trim(); }).length;
    var confirmadas = cementEntradas.filter(function(en){ return entradaNFStatus(en).status === "confirmada"; }).length;
    var nCanc = cementNFes.filter(nfCancelada).length, nTr = cementNFes.filter(nfTransf).length;
    var sub = (nCanc || nTr) ? (nCanc ? nCanc + ' cancelada(s)' : '') + (nCanc && nTr ? ' · ' : '') + (nTr ? nTr + ' transferência(s)' : '') : 'importadas do SEFAZ';
    function tile(rotulo, valor, subtxt, cor){ return '<div class="stat" style="--stat-accent:var(--'+cor+');"><div class="stat-top"><span>'+rotulo+'</span></div><div class="stat-val">'+valor+'</div><div class="stat-sub">'+subtxt+'</div></div>'; }
    el2.innerHTML = '<div class="stat-grid">' +
      tile("Notas SEFAZ", cementNFes.length, sub, "info") +
      tile("Lançamentos PUZL", puzlEntradas.length, "importados", "neutral") +
      tile("Entradas com documento", comDoc, "de " + cementEntradas.length + " entrada(s)", "accent") +
      tile("Descarregadas", confirmadas, "nota do SEFAZ = entrada da PUZL", "success") +
      '</div>';
  }

  // "Entradas — derivadas dos Lançamentos (PUZL)" tinha uma tabela própria
  // aqui, mas ela mostrava a mesma lista (mesma contagem) que o novo módulo
  // filtrável Lançamentos (PUZL) — repetido sem necessidade. A ligação com
  // Programação/NF (matchProgramacao, entradaNFStatus) continua existindo e
  // é usada em Controle de Pedidos e na própria Programação — só a tabela
  // duplicada saiu daqui; o que resta em Base de Dados é o resumo (stats).
  function paintBaseDados(){
    paintBaseDadosStats();
  }

  /* ---------------- Controle de Pedidos de Cimento ---------------- */
  var pedidosFiltro = "todos";
  // Controle de Pedidos passou a ser formado pelas NOTAS DO SEFAZ (cementNFes),
  // não mais pelas entradas: cada nota puxa usina/fábrica/placa da Programação
  // de Cimento (via nfProgMatch, pelo nº do pedido — combinado com você como a
  // base confiável — conferido pela placa quando ela também vier na nota) e é
  // conferida contra o resumo de entradas (nfEntradaMatch) pra saber se já
  // descarregou. Entradas que ainda não têm nota do SEFAZ correspondente (a
  // nota pode não ter sido importada ainda, ou o número não bateu) não somem:
  // ficam numa área separada, pra conferência individual — já que toda
  // entrada é, em tese, uma nota do SEFAZ que já foi lançada na usina.
  var pedidosPicker;
  function renderControlePedidos(){
    el("view-controle-pedidos-cimento").innerHTML =
      '<div class="card banner" style="margin-bottom:16px;">Cada nota importada em <b>Base de Dados &gt; Notas Fiscais (SEFAZ)</b> é ligada à Programação de Cimento pelo nº do pedido (conferida pela placa, quando informada); sem pedido na nota, a ligação cai pra Usina + Placa + Data. Depois é comparada com o resumo de Entradas pra saber se já descarregou. Pra importar notas ou entradas, use a aba <b>Base de Dados</b>.</div>' +
      '<div class="card" style="margin-bottom:16px;"><div class="filters" style="align-items:center;">' +
      '<div class="filter-field"><span>Período (emissão da nota)</span>' +
      '<div class="daterange"><button class="daterange-btn" id="pedDrBtn">📅 <span id="pedDrLabel"></span> <span style="opacity:.6;">▾</span></button>' +
      '<div class="daterange-panel" id="pedDrPanel"></div></div></div>' +
      '<div class="filter-count" id="pedDayInfo"></div></div></div>' +
      '<div id="pedidosStats"></div>' +
      '<div class="card" id="pedidosCard" style="margin-bottom:16px;"></div>' +
      '<div id="pedidosSemNFCard"></div>';
    pedidosPicker = makeRangePicker({btn:"pedDrBtn", panel:"pedDrPanel", label:"pedDrLabel"}, paintPedidos);
    paintPedidos();
  }

  // Mesmo critério de intervalo usado no seletor de período da Programação de
  // Cimento e do VPO (makeRangePicker) — aqui aplicado à data de emissão da
  // nota (cementNFes) e à data de entrada (cementEntradas), pra filtrar
  // Controle de Pedidos pelo mesmo tipo de período.
  function dateInPickerRange(iso, state){
    if (!iso) return false;
    var lo = state.rangeStart < state.rangeEnd ? state.rangeStart : state.rangeEnd;
    var hi = state.rangeStart < state.rangeEnd ? state.rangeEnd : state.rangeStart;
    return iso >= toISO(lo) && iso <= toISO(hi);
  }
  function pedidosNFesNoPeriodo(){
    return cementNFes.filter(function(nf){ return dateInPickerRange(nf.emissao, pedidosPicker.state); });
  }

  function paintPedidosStats(){
    var statMeta = [
      ["confere","Confere","success","✅"],
      ["sem_certeza","Sem certeza","warning","🕒"],
      ["nao_vinculado","Não vinculado","danger","🚫"]
    ];
    var nfs = pedidosNFesNoPeriodo();
    var nfsReg = nfs.filter(nfSoRegistro);
    nfs = nfs.filter(function(nf){ return !nfSoRegistro(nf); });
    var confirmadas = nfs.filter(function(nf){ return nfEntradaMatch(nf) !== null; }).length;
    el("pedidosStats").innerHTML = '<div class="stat-grid">' +
      '<div class="stat" style="--stat-accent:var(--accent);"><div class="stat-top"><span>Total de notas (SEFAZ)</span><span class="stat-icn" style="background:var(--accent-soft);color:var(--accent-strong);">🧾</span></div><div class="stat-val">'+nfs.length+'</div></div>' +
      statMeta.map(function(s){
        return '<div class="stat" style="--stat-accent:var(--'+s[2]+');"><div class="stat-top"><span>'+s[1]+'</span><span class="stat-icn" style="background:var(--'+s[2]+'-soft);color:var(--'+s[2]+');">'+s[3]+'</span></div><div class="stat-val">'+pedidosCount(s[0])+'</div></div>';
      }).join("") +
      '<div class="stat" style="--stat-accent:var(--success);"><div class="stat-top"><span>Confirmadas (Entradas)</span><span class="stat-icn" style="background:var(--success-soft);color:var(--success);">✅</span></div><div class="stat-val">'+confirmadas+'</div></div>' +
      '<div class="stat" style="--stat-accent:var(--danger);"><div class="stat-top"><span>Só registro (canceladas / transf.)</span><span class="stat-icn" style="background:var(--danger-soft);color:var(--danger);">🚫</span></div><div class="stat-val">'+nfsReg.length+'</div><div class="stat-sub">'+nfsReg.filter(nfCancelada).length+' cancelada(s)</div></div>' +
      '</div>';
  }

  function pedidosCount(st){
    var nfs = pedidosNFesNoPeriodo();
    if (st === "todos") return nfs.length;
    return nfs.filter(function(nf){ return !nfSoRegistro(nf) && nfSituacao(nf).situacao === st; }).length;
  }

  function paintPedidos(){
    pedidosPicker.updateLabel();
    el("pedDayInfo").textContent = pedidosNFesNoPeriodo().length + " nota(s) de " + cementNFes.length + " no total exibida(s) no período selecionado";

    var tabsDef = [["todos","Todos"]].concat(SITUACAO_OPTS_NF.map(function(s){ return [s.value, s.label]; }));
    var tabsHtml = tabsDef.map(function(t){
      return '<button data-filtro="'+t[0]+'" class="'+(pedidosFiltro===t[0]?"active":"")+'">'+t[1]+' ('+pedidosCount(t[0])+')</button>';
    }).join("");

    var withMatch = pedidosNFesNoPeriodo().map(function(nf){ return {nf:nf, s:nfSituacao(nf)}; });
    var list = pedidosFiltro === "todos" ? withMatch : withMatch.filter(function(x){ return !nfSoRegistro(x.nf) && x.s.situacao === pedidosFiltro; });

    var toneToBadge = {"usina-ok":"success","usina-conferir":"warning","usina-danger":"danger"};
    var rows = list.map(function(x){
      var nf = x.nf, s = x.s; if (nfTransf(nf)) s = {situacao:"nao_vinculado", entry:null, iso:null, placaOk:null, matchedBy:null};
      var meta = SITUACAO_OPTS_NF.find(function(m){ return m.value === s.situacao; });
      var toneClass = nfCancelada(nf) ? "usina-danger" : (nfTransf(nf) ? "usina-info" : (meta ? meta.tone : ""));
      var vinculoLabel = (meta ? meta.label : "—") + (NF_MATCH_LABEL[s.matchedBy] || "");
      var avisoNf = nfCancelada(nf) ? '<span class="badge danger" style="margin-right:4px;">🚫 NOTA CANCELADA</span>' : (nfTransf(nf) ? '<span class="badge info" style="margin-right:4px;">🔁 Transferência — só registro</span>' : '');
      var vinculoBadge = '<td style="padding:4px 6px;">'+avisoNf+(nfTransf(nf) || (nfCancelada(nf) && !s.entry) ? '' : '<span class="badge '+(toneToBadge[s.situacao === "nao_vinculado" ? "usina-danger" : (s.situacao === "sem_certeza" ? "usina-conferir" : "usina-ok")]||"neutral")+'">'+esc(vinculoLabel)+'</span>')+'</td>';
      var pedidoCell = nf.pedido
        ? esc(nf.pedido)
        : (s.entry ? '<span class="faint" style="font-size:11px;">(via prog: '+esc(s.entry.pedido)+')</span>' : '<span class="faint" style="font-style:italic;">—</span>');
      var usina = s.entry ? esc(s.entry.usina) : (nf.usina ? esc(nf.usina) : '<span class="faint" style="font-style:italic;">—</span>');
      var fabrica = s.entry ? esc(s.entry.fabrica) : "";
      var placaProg = s.entry ? esc(s.entry.carretas) : "";
      var placaCell = s.placaOk === false
        ? (nf.placa
            ? '<span class="badge danger">'+esc(nf.placa)+' ≠ '+placaProg+'</span>'
            : '<span class="faint" style="font-style:italic;font-size:11px;">sem placa na nota</span> <span class="faint" style="font-size:11px;">(prog: '+placaProg+')</span>')
        : esc(nf.placa) + (placaProg && placaProg !== nf.placa ? ' <span class="faint" style="font-size:11px;">(prog: '+placaProg+')</span>' : "");
      var entradaMatch = nfEntradaMatch(nf);
      var statusBadge = nfCancelada(nf)
        ? '<span class="badge danger">🚫 Cancelada'+(entradaMatch ? ' — ⚠ há entrada lançada!' : '')+'</span>'
        : nfTransf(nf) ? '<span class="badge info">Só registro</span>'
        : entradaMatch
        ? '<span class="badge success">✅ Confirmada</span>'
        : '<span class="badge warning">Emitida</span>';
      return '<tr'+(nfCancelada(nf) ? ' class="nf-cancelada"' : '')+'>' +
        '<td class="'+toneClass+'" style="padding:8px 10px;font-size:12.5px;">'+esc(nf.numero)+(nfCancelada(nf) ? '<span class="nf-msg">⚠ NOTA CANCELADA</span>' : '')+'</td>' +
        '<td style="padding:8px 10px;font-size:12.5px;">'+esc(brDate(nf.emissao))+'</td>' +
        '<td style="padding:8px 10px;font-size:12.5px;"><span class="badge neutral">'+esc(nf.fornecedor)+'</span></td>' +
        '<td style="padding:8px 10px;font-size:12.5px;">'+pedidoCell+'</td>' +
        '<td style="padding:8px 10px;font-size:12.5px;">'+usina+'</td>' +
        '<td style="padding:8px 10px;font-size:12.5px;">'+fabrica+'</td>' +
        '<td style="padding:8px 10px;font-size:12.5px;">'+placaCell+'</td>' +

        '<td style="padding:4px 6px;">'+statusBadge+'</td>' +
        '</tr>';

      (list.length
        ? '<div class="table-wrap"><table><thead><tr><th>Número NF</th><th>Emissão</th><th>Fornecedor</th><th>Pedido</th><th>Usina</th><th>Fábrica</th><th>Placa</th><th>Vínculo c/ Programação</th><th>Status (Entradas)</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        : '<p class="prog-empty">Nenhuma nota nessa situação.</p>');

    el("pedidosCard").querySelectorAll(".pedidos-tabs button").forEach(function(b){
      b.addEventListener("click", function(){ pedidosFiltro = b.dataset.filtro; paintPedidos(); });
    });
    xlEnhance(el("pedidosCard"), "pedidos");
    paintPedidosStats();
    paintPedidosSemNF();
  }

  // Área separada pra conferência individual: entradas do resumo que ainda
  // não bateram com nenhuma nota do SEFAZ importada (pedido pra criar esse
  // campo à parte, em vez de esconder ou misturar com a tabela principal).

      var progInfo = m.entry

    cardEl.innerHTML =
      '<details style="margin-bottom:16px;" open><summary style="cursor:pointer;padding:12px 18px;font-size:12.5px;font-weight:600;color:var(--accent-strong);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);">🔍 Conferência individual — entradas sem nota do SEFAZ correspondente ('+semNF.length+')</summary>' +
      '<div class="card" style="margin-top:8px;">' +
      '<p class="import-card-desc" style="margin:0 0 10px;">Toda entrada lançada é, em tese, uma nota do SEFAZ que já chegou na usina — as linhas abaixo ainda não bateram com nenhuma nota importada (pode ser que a NF ainda não tenha sido importada em Base de Dados, ou o número tenha sido digitado diferente). Confira uma a uma.</p>' +
      (semNF.length
        ? '<div class="table-wrap"><table><thead><tr><th>Data entrada</th><th>Usina</th><th>Fábrica</th><th>Nº pedido</th><th>Documento/NF</th><th>Quantidade</th><th>Motivo</th><th>Programação encontrada</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        : '<p class="prog-empty">Todas as entradas já têm nota do SEFAZ correspondente.</p>') +
      '</div></details>';
    xlEnhance(cardEl, "pedidos-sem-nf");
  }

  /* ---------------- Consultas ---------------- */
  // Antes, Consulta Geral e Consulta Pedágio tinham listas fictícias próprias,
  // sem relação com o resto do sistema. Agora as duas são alimentadas pelas
  // mesmas entradas cadastradas em Base de Dados (cementEntradas):
  // - Consulta Geral reaproveita a mesma conferência contra a Programação de
  //   Cimento usada em Controle de Pedidos (matchProgramacao) — é a mesma
  //   lista, só que com busca dedicada nessa tela;
  // - Consulta Pedágio reaproveita o roteiro usina→fábrica configurado (o
  //   mesmo mapa usado na tela de VPO, ROTAS_POR_USINA) pra indicar se a rota
  //   da entrada tem pedágio. Quando a fábrica da entrada não bate com
  //   nenhuma opção cadastrada pra aquela usina, o registro fica marcado como
  //   "Não identificado" em vez de mostrar um status inventado.
  // Sobre o "cte": não achei nenhuma coluna chamada "CTE" nas 3 abas da
  // planilha original — o campo mais próximo era "Frete" da área de
  // transporte. Como isso não é um dado que existe nas entradas reais
  // (cementEntradas só guarda data/usina/fábrica/pedido/documento/quantidade),
  // esse campo não aparece mais aqui; se for algo que precisa mesmo aparecer,
  // me diga de onde ele vem que eu adiciono.
  var consultaAba = "geral";
  var consultaBusca = "";

  // Tenta achar, no roteiro configurado pra usina da entrada, a fábrica cujo
  // nome bate (por substring) com o código de fábrica da entrada — ex.: uma
  // entrada com fabrica "CSN" casa com a opção "CSN - Volta Redonda". Quando
  // não dá pra identificar, retorna null (tratado na tela como "Não
  // identificado", nunca como um status de pedágio chutado).
  function resolveRotaPedagio(entrada){
    var rotas = ROTAS_POR_USINA[String(entrada.usina||"").trim().toUpperCase()];
    if (!rotas) return null;
    var alvo = String(entrada.fabrica||"").trim().toUpperCase();
    if (!alvo) return null;
    return rotas.find(function(r){ return r.fabrica.toUpperCase().indexOf(alvo) !== -1; }) || null;
  }

  function renderConsultas(){
    el("view-consultas").innerHTML =
      '<div class="card banner" style="margin-bottom:16px;">Consulta dos pedidos a partir das entradas cadastradas em <b>Base de Dados</b>. A <b>Consulta Geral</b> mostra a mesma conferência contra a Programação de Cimento usada em Controle de Pedidos; a <b>Consulta Pedágio</b> mostra o status de pedágio da rota (usina → fábrica), reaproveitando a mesma configuração da tela de VPO.</div>' +
      '<div class="pedidos-tabs" id="consultaAbas">' +
        '<button data-aba="geral" class="'+(consultaAba==="geral"?"active":"")+'">Consulta Geral</button>' +
        '<button data-aba="pedagio" class="'+(consultaAba==="pedagio"?"active":"")+'">Consulta Pedágio</button>' +
      '</div>' +
      '<div class="card" style="margin-bottom:16px;"><div class="filters" style="align-items:center;">' +
        '<div class="filter-field" style="min-width:260px;"><span>Buscar</span>' +
        '<input id="consultaBusca" type="text" placeholder="usina, fábrica, pedido ou documento" value="'+esc(consultaBusca)+'" style="height:32px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:12.5px;padding:0 10px;min-width:260px;"/></div>' +
        '<div class="filter-count" id="consultaCount"></div>' +
      '</div></div>' +
      '<div class="card" id="consultaCard"></div>';

    el("consultaAbas").querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){ consultaAba = b.dataset.aba; paintConsulta(); });
    });
    el("consultaBusca").addEventListener("input", function(){ consultaBusca = this.value; paintConsulta(); });
    paintConsulta();
  }

  function consultaMatches(en, q){
    if (!q) return true;
    q = q.trim().toLowerCase();
    return [en.usina, en.fabrica, en.pedido, en.documento, en.id].some(function(v){
      return String(v||"").toLowerCase().indexOf(q) !== -1;
    });
  }

  function paintConsulta(){
    el("consultaAbas").querySelectorAll("button").forEach(function(b){ b.classList.toggle("active", b.dataset.aba === consultaAba); });
    var toneToBadge = {"usina-ok":"success","usina-conferir":"warning","usina-info":"info","usina-danger":"danger"};
    var list = cementEntradas.filter(function(en){ return consultaMatches(en, consultaBusca); });

    if (consultaAba === "geral"){
      var rows = list.map(function(en){
        var m = matchProgramacao(en);
        var meta = SITUACAO_OPTS.find(function(s){ return s.value === m.situacao; });
        var toneClass = meta ? meta.tone : "";
        var progInfo = m.entry
          ? esc(m.entry.usina) + ' · ' + esc(m.entry.fabrica) + (m.dataProgramada && m.dataProgramada !== en.data ? ' (programado '+esc(brDate(m.dataProgramada))+')' : '')
          : '<span class="faint" style="font-style:italic;">sem correspondência</span>';
        return '<tr>' +
          '<td class="cell-strong">#'+esc(en.id)+'</td>' +
          '<td class="muted">'+esc(brDate(en.data))+'</td>' +
          '<td>'+esc(en.usina)+'</td>' +
          '<td><span class="badge neutral">'+esc(en.fabrica)+'</span></td>' +
          '<td>'+esc(en.pedido||"—")+'</td>' +
          '<td>'+esc(en.documento||"—")+'</td>' +
          '<td class="muted">'+esc(en.quantidade)+'</td>' +
          '<td><span class="badge '+(toneToBadge[toneClass]||"neutral")+'">'+esc(meta?meta.label:"—")+'</span></td>' +
          '<td class="muted" style="font-size:11.5px;">'+progInfo+'</td>' +
          '<td class="muted">'+esc(en.obs||"")+'</td>' +
          '</tr>';
      }).join("");
      el("consultaCard").innerHTML = list.length
        ? '<div class="table-wrap"><table><thead><tr><th>Cód</th><th>Data entrada</th><th>Usina</th><th>Fábrica</th><th>Nº pedido</th><th>Documento/NF</th><th>Quantidade</th><th>Situação</th><th>Programação encontrada</th><th>Observação</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        : '<p class="prog-empty">Nenhum pedido encontrado pra essa busca.</p>';
      el("consultaCount").textContent = list.length + " de " + cementEntradas.length + " pedido(s)";
      xlEnhance(el("consultaCard"), "consulta-geral");
    } else {
      var rowsP = list.map(function(en){
        var rota = resolveRotaPedagio(en);
        var statusBadge = rota
          ? '<span class="badge '+(PEDAGIO_TONE[rota.pedagio]||"neutral")+'">'+esc(PEDAGIO_LABEL[rota.pedagio]||"—")+'</span>'
          : '<span class="badge neutral">Não identificado</span>';
        return '<tr>' +
          '<td class="cell-strong">#'+esc(en.id)+'</td>' +
          '<td class="muted">'+esc(brDate(en.data))+'</td>' +
          '<td>'+esc(en.usina)+'</td>' +
          '<td><span class="badge neutral">'+esc(en.fabrica)+'</span></td>' +
          '<td class="muted">'+esc(rota ? rota.fabrica : "—")+'</td>' +
          '<td>'+esc(en.documento||en.pedido||"—")+'</td>' +
          '<td class="muted">'+esc(en.quantidade)+'</td>' +
          '<td>'+statusBadge+'</td>' +
          '</tr>';
      }).join("");
      el("consultaCard").innerHTML = list.length
        ? '<div class="table-wrap"><table><thead><tr><th>Cód</th><th>Data entrada</th><th>Usina</th><th>Fábrica</th><th>Rota identificada</th><th>Documento/NF</th><th>Quantidade</th><th>Pedágio</th></tr></thead><tbody>'+rowsP+'</tbody></table></div>'
        : '<p class="prog-empty">Nenhum registro encontrado pra essa busca.</p>';
      el("consultaCount").textContent = list.length + " de " + cementEntradas.length + " registro(s)";
      xlEnhance(el("consultaCard"), "consulta-pedagio");
    }
  }

  /* ---------------- Códigos por Fornecedor ---------------- */
  function renderCodigosCimento(){
    var tabs = cementSuppliers.map(function(s){ return '<button class="btn-ghost" data-sup="'+s.id+'" style="font-weight:600;">'+esc(s.nome)+'</button>'; }).join("");
    el("codigosCimentoCard").innerHTML =
      '<details style="margin-bottom:16px;">' +
      '<summary style="cursor:pointer;padding:12px 18px;font-size:12.5px;font-weight:600;color:var(--accent-strong);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);">🔑 Cadastros — Códigos por Fornecedor</summary>' +
      '<div style="margin-top:8px;">' +
      '<div class="card banner" style="margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;">' +
      '<span>🛡️</span><span>Login, senha e URL de portal de cada fornecedor não aparecem aqui de propósito — ficam fora do sistema por enquanto. Esta tela mostra apenas o código de cliente por usina e um resumo de como marcar o pedido.</span></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;" id="supTabs">'+tabs+'</div>' +
      '<div class="card" id="supCard"></div>' +
      '</div></details>';

    function paint(id){
      var s = cementSuppliers.find(function(x){ return x.id === id; });
      el("supTabs").querySelectorAll("button").forEach(function(b){
        var active = b.dataset.sup === id;
        b.style.background = active ? "var(--accent-strong)" : "var(--surface)";
        b.style.color = active ? "#fff" : "var(--text-muted)";
        b.style.borderColor = active ? "var(--accent-strong)" : "var(--border-strong)";
      });
      var rows = s.codigos.map(function(c, i){
        return '<tr>' +
          '<td style="padding:4px 6px;"><input value="'+esc(c[0])+'" placeholder="Nome da usina" data-sup="'+id+'" data-idx="'+i+'" data-field="0" style="width:100%;border:1px solid transparent;border-radius:5px;padding:6px 8px;font-size:12.5px;background:transparent;color:var(--text);font-weight:600;" onfocus="this.style.borderColor=\'var(--accent)\'" onblur="this.style.borderColor=\'transparent\'"/></td>' +
          '<td style="padding:4px 6px;"><input value="'+esc(c[1])+'" placeholder="Código de cliente" data-sup="'+id+'" data-idx="'+i+'" data-field="1" style="width:100%;border:1px solid transparent;border-radius:5px;padding:6px 8px;font-size:12.5px;background:transparent;color:var(--text);font-family:ui-monospace,monospace;" onfocus="this.style.borderColor=\'var(--accent)\'" onblur="this.style.borderColor=\'transparent\'"/></td></tr>';
      }).join("");
      var body =
        '<div class="table-wrap"><table><thead><tr><th>Usina</th><th>Código de cliente</th></tr></thead><tbody id="supBody">' +
        (rows || '<tr><td colspan="2" style="padding:16px 14px;font-size:12px;font-style:italic;color:var(--text-faint);">Este fornecedor ainda não tem código de cliente cadastrado por usina (ver observação acima).</td></tr>') +
        '</tbody></table></div>' +
        '<div class="prog-add" id="supAdd">+ adicionar código</div>';
      el("supCard").innerHTML = '<div class="card-head"><div><h2>Códigos — '+esc(s.nome)+'</h2><p>'+esc(s.como)+'</p></div></div>' + body;

      el("supBody").querySelectorAll("input").forEach(function(inp){
        inp.addEventListener("change", function(){
          s.codigos[parseInt(inp.dataset.idx,10)][parseInt(inp.dataset.field,10)] = inp.value;
        });
      });
      el("supAdd").addEventListener("click", function(){
        s.codigos.push(["", ""]);
        paint(id);
      });
    }
    el("supTabs").querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){ paint(b.dataset.sup); });
    });
    paint(cementSuppliers[0].id);

  // Base de Fábricas: Fornecedor x Material — o que padroniza o campo
  // "Fábrica" na Programação (ver FABRICAS_CATALOGO). Sem usina/localização
  // de propósito: aqui só interessa quem fornece e o que fornece; a usina já
  // é a linha da Programação. Editável: adicionar/remover fornecedor, e por
  // fornecedor adicionar/remover material (mesmo padrão de chips do Catálogo
  // de Cimentos).
  function renderFabricasCatalogo(){
    var cardEl = el("fabricasCatalogoCard");
    if (!cardEl) return;
    var activeIdx = 0;
    var detailsOpen = false;
    function paint(){
      if (activeIdx >= FABRICAS_CATALOGO.length) activeIdx = 0;
      var tabs = FABRICAS_CATALOGO.map(function(f, i){
        return '<button class="btn-ghost" data-fidx="'+i+'" style="font-weight:600;">'+esc(f.fornecedor)+'</button>';
      }).join("");
      // Repinta o painel inteiro a cada ação (trocar de aba, adicionar/remover
      // fornecedor ou material) — sem o atributo "open" aqui, o <details>
      // fecharia sozinho a cada clique, então o estado é guardado à parte e
      // reaplicado (com um listener de "toggle" pra continuar acompanhando
      // se o usuário abrir/fechar manualmente).
      cardEl.innerHTML =
        '<details style="margin-bottom:0;"'+(detailsOpen?" open":"")+'><summary style="cursor:pointer;padding:12px 18px;font-size:12.5px;font-weight:600;color:var(--accent-strong);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);">🏗️ Base de Fábricas — Fornecedor x Material ('+FABRICAS_CATALOGO.length+')</summary>' +
        '<div class="card" style="margin-top:8px;">' +
        '<p class="import-card-desc" style="margin:0 0 10px;">Padroniza o campo Fábrica na Programação de Cimento: escolhe fornecedor + material numa lista em vez de digitar livre. Sem usina aqui — a usina já é a linha da Programação.</p>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;" id="fabTabs">'+tabs+'</div>' +
        '<div style="display:flex;gap:8px;margin-bottom:16px;">' +
        '<input id="fabNovoFornecedor" type="text" placeholder="Novo fornecedor (ex: Polimix)" style="flex:1;border:1px solid var(--border-strong);border-radius:6px;padding:7px 10px;font-size:12.5px;background:var(--surface);color:var(--text);"/>' +
        '<button class="btn-primary" id="fabAddFornecedorBtn" style="padding:7px 14px;">+ fornecedor</button>' +
        '</div>' +
        '<div id="fabMateriaisCard"></div>' +
        '</div></details>';

      cardEl.querySelector("details").addEventListener("toggle", function(e){ detailsOpen = e.target.open; });

      el("fabTabs").querySelectorAll("button").forEach(function(b){
        var i = parseInt(b.dataset.fidx, 10);
        var active = i === activeIdx;
        b.style.background = active ? "var(--accent-strong)" : "var(--surface)";
        b.style.color = active ? "#fff" : "var(--text-muted)";
        b.style.borderColor = active ? "var(--accent-strong)" : "var(--border-strong)";
        b.addEventListener("click", function(){ activeIdx = i; detailsOpen = true; paint(); });
      });
      el("fabAddFornecedorBtn").addEventListener("click", function(){
        var v = el("fabNovoFornecedor").value.trim();
        if (!v) return;
        if (FABRICAS_CATALOGO.some(function(f){ return f.fornecedor.toUpperCase() === v.toUpperCase(); })) return;
        FABRICAS_CATALOGO.push({fornecedor:v, materiais:[], cnpjs:[]});
        activeIdx = FABRICAS_CATALOGO.length - 1;
        detailsOpen = true;
        paint();
      });

      var f = FABRICAS_CATALOGO[activeIdx];
      if (!f.cnpjs) f.cnpjs = []; // fornecedor criado antes deste campo existir, ou pela tela de material novo
      var chips = f.materiais.map(function(mat, idx){
        return '<span class="badge success" style="gap:8px;">'+esc(mat)+' <button data-delmat="'+idx+'" style="border:none;background:none;color:inherit;cursor:pointer;font-weight:800;padding:0;">✕</button></span>';
      }).join(" ");
      // Cadastro de CNPJ do fornecedor (cruzado do SEFAZ/PUZL reais — uma
      // linha por razão social/filial, já que o mesmo fornecedor pode faturar
      // por mais de um CNPJ/planta) — ao lado de Materiais, mesmo padrão de
      // tabela editável já usado em Base de Usinas / Códigos por Fornecedor.
      var cnpjRows = f.cnpjs.map(function(c, idx){
        return '<tr>' +
          '<td style="padding:4px 6px;"><input value="'+esc(c[0])+'" placeholder="Razão social (como aparece na nota)" data-cidx="'+idx+'" data-cfield="0" style="width:100%;border:1px solid transparent;border-radius:5px;padding:6px 8px;font-size:12.5px;background:transparent;color:var(--text);" onfocus="this.style.borderColor=\'var(--accent)\'" onblur="this.style.borderColor=\'transparent\'"/></td>' +
          '<td style="padding:4px 6px;"><input value="'+esc(c[1])+'" placeholder="00.000.000/0000-00" data-cidx="'+idx+'" data-cfield="1" style="width:100%;border:1px solid transparent;border-radius:5px;padding:6px 8px;font-size:12.5px;background:transparent;color:var(--text);font-family:ui-monospace,monospace;" onfocus="this.style.borderColor=\'var(--accent)\'" onblur="this.style.borderColor=\'transparent\'"/></td>' +
          '<td style="padding:4px 6px;"><button class="btn-ghost" data-delcnpj="'+idx+'" style="padding:5px 8px;">🗑</button></td>' +
          '</tr>';
      }).join("");
      el("fabMateriaisCard").innerHTML =
        '<div class="card-head"><div><h2>Materiais — '+esc(f.fornecedor)+'</h2><p>Tipos de cimento que esse fornecedor entrega (aparecem no select de Fábrica na Programação).</p></div>' +
        '<button class="btn-ghost" id="fabDelFornecedorBtn" style="padding:6px 10px;color:var(--danger);">🗑 remover fornecedor</button></div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">'+(chips || '<span class="faint" style="font-style:italic;">Nenhum material cadastrado pra esse fornecedor ainda.</span>')+'</div>' +
        '<div style="display:flex;gap:8px;">' +
        '<input id="fabNovoMaterial" type="text" placeholder="ex: CP II F" style="flex:1;border:1px solid var(--border-strong);border-radius:6px;padding:7px 10px;font-size:12.5px;background:var(--surface);color:var(--text);"/>' +
        '<button class="btn-primary" id="fabAddMaterialBtn" style="padding:7px 14px;">Adicionar</button>' +
        '</div>' +
        '<div class="sec-title" style="margin-top:18px;">CNPJ cadastrados — '+esc(f.fornecedor)+' ('+f.cnpjs.length+')</div>' +
        '<p class="import-card-desc" style="margin:0 0 10px;">Cruzado das notas reais do SEFAZ/PUZL já importadas — cada linha é uma razão social/filial que já faturou como este fornecedor. Editável, igual à Base de Usinas.</p>' +
        '<div class="table-wrap"><table><thead><tr><th>Razão social</th><th>CNPJ</th><th></th></tr></thead><tbody id="fabCnpjBody">' +
        (cnpjRows || '<tr><td colspan="3" style="padding:16px 14px;font-size:12px;font-style:italic;color:var(--text-faint);">Nenhum CNPJ cadastrado ainda pra esse fornecedor.</td></tr>') +
        '</tbody></table></div>' +
        '<div class="prog-add" id="fabCnpjAdd">+ adicionar CNPJ</div>';

      el("fabMateriaisCard").querySelectorAll("[data-delmat]").forEach(function(btn){
        btn.addEventListener("click", function(e){
          e.preventDefault();
          f.materiais.splice(parseInt(btn.dataset.delmat, 10), 1);
          detailsOpen = true;
          paint();
        });
      });
      el("fabDelFornecedorBtn").addEventListener("click", function(){
        FABRICAS_CATALOGO.splice(activeIdx, 1);
        activeIdx = 0;
        detailsOpen = true;
        paint();
      });
      el("fabAddMaterialBtn").addEventListener("click", function(){
        var v = el("fabNovoMaterial").value.trim();
        if (!v) return;
        if (f.materiais.some(function(m){ return m.toUpperCase() === v.toUpperCase(); })) return;
        f.materiais.push(v);
        detailsOpen = true;
        paint();
      });
      el("fabCnpjBody").querySelectorAll("input").forEach(function(inp){
        inp.addEventListener("change", function(){
          f.cnpjs[parseInt(inp.dataset.cidx, 10)][parseInt(inp.dataset.cfield, 10)] = inp.value;
        });
      });
      el("fabMateriaisCard").querySelectorAll("[data-delcnpj]").forEach(function(btn){
        btn.addEventListener("click", function(e){
          e.preventDefault();
          f.cnpjs.splice(parseInt(btn.dataset.delcnpj, 10), 1);
          detailsOpen = true;
          paint();
        });
      });
      el("fabCnpjAdd").addEventListener("click", function(){
        f.cnpjs.push(["", ""]);
        detailsOpen = true;
        paint();
      });
    }
    paint();
  }

  /* ---------------- Dashboard ---------------- */
  function renderDashboard(){
    // Bloco "Cimento" — dados reais do sistema atual (entradas cadastradas em
    // Base de Dados, conferidas contra a Programação de Cimento), diferente
    // do bloco de Operações abaixo, que ainda usa a base genérica fictícia.
    var cimStats = [
      ["Total de pedidos", cementEntradas.length, "accent", "📦"],
      ["Confere", pedidosCount("confere"), "success", "✅"],
      ["Sem certeza", pedidosCount("sem_certeza"), "warning", "🕒"],
      ["Data incorreta", pedidosCount("data_incorreta"), "info", "📆"],
      ["Não realizado", pedidosCount("nao_realizado"), "danger", "🚫"]
    ];
    var cimStatsHtml = '<div class="card" style="margin-bottom:16px;"><div class="card-head"><div><h2>Cimento — pedidos</h2><p>Total de pedidos e situação, a partir das entradas cadastradas em Base de Dados</p></div></div>' +
      '<div class="stat-grid">' + cimStats.map(function(s){

    var today = operations.filter(function(o){ return o.date === "2026-09-18"; });

    var statsHtml = '<div class="stat-grid">' + stats.map(function(s){

      '<div class="table-wrap"><table><thead><tr><th>ID</th><th>Tipo</th><th>Usina</th><th>Transportadora</th><th>Status</th><th>Motivo</th><th>Tempo pendente</th><th>Ação</th></tr></thead><tbody>' +

  /* ---------------- Operações ---------------- */
  function renderOperacoes(){
    var uniq = function(arr){ return Array.from(new Set(arr)); };
    var dates = ["Todos"].concat(uniq(operations.map(function(o){return o.date;})));
    var usinas = ["Todos"].concat(uniq(operations.map(function(o){return o.usina;})));
    var transps = ["Todos"].concat(uniq(operations.map(function(o){return o.transp;})));

    function optionsHtml(list){ return list.map(function(v){ return '<option value="'+esc(v)+'">'+esc(v)+'</option>'; }).join(""); }

    var html = '<div class="card" style="margin-bottom:16px;"><div class="filters">' +
      '<div class="filter-field"><span>Data</span><select id="fDate">'+optionsHtml(dates)+'</select></div>' +
      '<div class="filter-field"><span>Usina</span><select id="fUsina">'+optionsHtml(usinas)+'</select></div>' +
      '<div class="filter-field"><span>Transportadora</span><select id="fTransp">'+optionsHtml(transps)+'</select></div>' +
      '<div class="filter-field"><span>Status</span><select id="fStatus"><option value="Todos">Todos</option>' +
      Object.keys(STATUS).map(function(k){ return '<option value="'+k+'">'+esc(STATUS[k].label)+'</option>'; }).join("") + '</select></div>' +
      '<div class="filter-count" id="fCount"></div></div></div>' +
      '<div class="card"><div class="card-head"><div><h2>Operações</h2><p>Tabela genérica — campos provisórios, sujeitos a alteração</p></div></div>' +
      '<div class="table-wrap"><table><thead><tr><th>ID</th><th>Data</th><th>Origem</th><th>Destino</th><th>Usina</th><th>Transportadora</th><th>Status</th><th>Situação</th><th>Última atualização</th></tr></thead><tbody id="opBody"></tbody></table></div></div>';
    el("view-operacoes").innerHTML = html;

    function fmtDate(iso){ var p = iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }

    function apply(){
      var d = el("fDate").value, u = el("fUsina").value, t = el("fTransp").value, s = el("fStatus").value;
      var filtered = operations.filter(function(o){
        return (d==="Todos"||o.date===d) && (u==="Todos"||o.usina===u) && (t==="Todos"||o.transp===t) && (s==="Todos"||o.status===s);
      });
      el("fCount").textContent = filtered.length + " de " + operations.length + " operações";
      el("opBody").innerHTML = filtered.length ? filtered.map(function(o){
        return '<tr><td class="cell-strong">'+esc(o.code)+'</td><td>'+fmtDate(o.date)+'</td><td>'+esc(o.origin)+'</td><td>'+esc(o.dest)+'</td><td>'+esc(o.usina)+'</td><td>'+esc(o.transp)+'</td><td>'+badge(STATUS[o.status])+'</td><td class="muted">'+esc(o.situacao)+'</td><td>'+esc(o.update)+'</td></tr>';
      }).join("") : '<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--text-faint);">Nenhuma operação encontrada para os filtros selecionados.</td></tr>';
    }
    ["fDate","fUsina","fTransp","fStatus"].forEach(function(id){ el(id).addEventListener("change", apply); });
    apply();
  }

  /* ---------------- VPO (formato Controle Claudir) ---------------- */
  var vpoPicker;
  var VPO_STATUS_OPTS = [
    {value:"", label:"—", tone:""},
    {value:"pendente", label:"Pendente (tem pedágio, precisa emitir)", tone:""},
    {value:"conferir", label:"Incerto — confirmar pedágio", tone:"usina-conferir"},
    {value:"nao_precisa", label:"Feito (sem pedágio)", tone:"usina-ok"},
    {value:"emitido", label:"Emitido", tone:"usina-ok"}
  ];

  // Uma linha por combinação usina+fábrica (rota), igual à aba "fabricas"
  // do Piso mínimo — cada usina pode ter mais de uma fábrica de origem.
  function renderPedagioConfigHtml(){
    var rows = MASTER_USINAS.map(function(u){
      var rotas = ROTAS_POR_USINA[u];
      if (!rotas || !rotas.length){
        return '<tr><td class="cell-strong" style="white-space:nowrap;">'+esc(u)+'</td><td class="faint" style="font-style:italic;" colspan="2">sem rota cadastrada — sem dado na planilha original</td></tr>';
      }
      return rotas.map(function(r, i){
        return '<tr><td class="cell-strong" style="white-space:nowrap;">'+(i===0?esc(u):'')+'</td>' +
          '<td class="muted">'+esc(r.fabrica)+' <span class="faint">x</span> '+esc(u)+'</td>' +
          '<td style="padding:4px 6px;"><select data-usina="'+esc(u)+'" data-idx="'+i+'" class="status-select">' +
          PEDAGIO_OPTS.map(function(o){ return '<option value="'+o.value+'"'+(o.value===r.pedagio?" selected":"")+'>'+esc(o.label)+'</option>'; }).join("") +
          '</select></td></tr>';
      }).join("");
    }).join("");
    return '<details style="margin-bottom:16px;"><summary style="cursor:pointer;padding:12px 18px;font-size:12.5px;font-weight:600;color:var(--accent-strong);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);">⚙️ Configurar rotas e pedágio (base extraída do "Piso mínimo" — conferir/ajustar com a operação)</summary>' +
      '<div class="card" style="margin-top:8px;max-height:360px;overflow-y:auto;"><div class="table-wrap"><table><thead><tr><th>Usina</th><th>Rota (fábrica x usina)</th><th>Pedágio</th></tr></thead><tbody id="pedagioBody">'+rows+'</tbody></table></div></div></details>';
  }

  function renderVpo(){
    el("view-vpo").innerHTML =
      '<div class="card banner" style="margin-bottom:16px;">Base para emissão de VPO — placa, motorista, carreta(s) e fábrica (fixos do veículo) seguem o formato do <b>Controle Claudir</b>. Dados fictícios: placas e nomes de motorista reais não entram no protótipo.<br/>' +
      'Nas colunas <b>Usina 1</b> e <b>Usina 2</b>, escolha direto o roteiro (fábrica de origem x usina) — comece digitando o nome da usina que a lista já filtra. O status do VPO é sugerido automaticamente pelo roteiro escolhido: <span class="badge success">sem pedágio → Feito</span> <span class="badge warning">incerto → confirmar</span> <span class="badge neutral">com pedágio → pendente</span>. Você pode ajustar manualmente depois, e a base de roteiros abaixo é editável.</div>' +
      renderPedagioConfigHtml() +
      '<div id="vpoStats"></div>' +
      '<div class="card" style="margin-bottom:16px;"><div class="filters" style="align-items:center;">' +
      '<div class="filter-field"><span>Período</span>' +
      '<div class="daterange"><button class="daterange-btn" id="vpoDrBtn">📅 <span id="vpoDrLabel"></span> <span style="opacity:.6;">▾</span></button>' +
      '<div class="daterange-panel" id="vpoDrPanel"></div></div></div>' +
      '<div class="filter-count" id="vpoDayInfo"></div></div></div>' +
      '<div id="vpoBlocks"></div>';

    el("pedagioBody").querySelectorAll("select[data-usina]").forEach(function(sel){
      sel.addEventListener("change", function(){
        var rotas = ROTAS_POR_USINA[sel.dataset.usina];
        var idx = parseInt(sel.dataset.idx, 10);
        if (rotas && rotas[idx]) rotas[idx].pedagio = sel.value;
        // Reaplica a sugestão automática em qualquer trecho já lançado que use exatamente esse roteiro.
        var changedKey = routeKey(sel.dataset.usina, rotas && rotas[idx] ? rotas[idx].fabrica : "");
        Object.keys(vpoScheduleByDate).forEach(function(iso){
          vpoScheduleByDate[iso].entries.forEach(function(e){
            if (e.usina1 === changedKey) applyAutoVpoStatus(e);
          });
        });
        paintVpoBlocks();
      });
    });

    vpoPicker = makeRangePicker({btn:"vpoDrBtn", panel:"vpoDrPanel", label:"vpoDrLabel"}, paintVpoBlocks);
    paintVpoBlocks();
  }

  function vpoEntryKey(e){ return e.fleetId || (e.__key || (e.__key = "extra-"+Date.now()+"-"+Math.random().toString(36).slice(2,7))); }

  function vpoGetOrCreateEntry(iso, key){
    if (!vpoScheduleByDate[iso]) vpoScheduleByDate[iso] = { isException:isSunday(fromISO(iso)), entries: [] };
    var day = vpoScheduleByDate[iso];
    var found = day.entries.find(function(e){ return vpoEntryKey(e) === key; });
    if (!found){
      var fleet = MASTER_VPO_FLEET.find(function(f){ return f.id === key; });
      found = fleet
        ? { fleetId:key, usina1:"", usina2:"", status:"", obs:"" }
        : { usina1:"", usina2:"", status:"", obs:"", __key:key, motoristaLivre:"", placaLivre:"", carretasLivre:"", fabricaLivre:"" };
      day.entries.push(found);
    }
    return found;
  }

  function vpoInput(iso, key, field, value, placeholder, tdClass){
    return '<td class="'+(tdClass||"")+'" style="padding:4px 6px;"><input value="'+esc(value)+'" placeholder="'+esc(placeholder||"")+'" data-iso="'+iso+'" data-key="'+esc(key)+'" data-field="'+field+'" ' +
      'style="width:100%;border:1px solid transparent;border-radius:5px;padding:6px 8px;font-size:12.5px;background:transparent;color:var(--text);" ' +
      'onfocus="this.style.borderColor=\'var(--accent)\'" onblur="this.style.borderColor=\'transparent\'"/></td>';
  }

  function vpoUsinaSelect(iso, key, field, value){
    // O valor da opção já é o roteiro inteiro ("USINA||FÁBRICA"): escolher
    // aqui é escolher a usina E a fábrica de origem numa coisa só. Agrupado
    // por usina (optgroup) — digitar o nome da usina já pula pro grupo certo.
    var opts = '<option value="">—</option>' + MASTER_USINAS.map(function(u){
      var rotas = ROTAS_POR_USINA[u];
      if (rotas && rotas.length){
        return '<optgroup label="'+esc(u)+'">' + rotas.map(function(r){
          var rk = routeKey(u, r.fabrica);
          return '<option value="'+esc(rk)+'"'+(rk===value?" selected":"")+'>'+esc(u)+' · '+esc(r.fabrica)+' — '+esc(PEDAGIO_LABEL[r.pedagio])+'</option>';
        }).join("") + '</optgroup>';
      }
      var rkVazio = routeKey(u, "");
      return '<option value="'+esc(rkVazio)+'"'+(rkVazio===value?" selected":"")+'>'+esc(u)+' (sem rota cadastrada)</option>';
    }).join("");
    return '<td style="padding:4px 6px;"><select data-iso="'+iso+'" data-key="'+esc(key)+'" data-field="'+field+'" class="status-select">'+opts+'</select></td>';
  }

  function paintVpoBlocks(){
    vpoPicker.updateLabel();
    var days = rangeDays(vpoPicker.state);
    var shown = 0;
    var vagg = { emitido:0, pendente:0, conferir:0, feito:0 };

    var html = days.map(function(day){
      var iso = toISO(day);
      var data = vpoDayData(iso);
      var sunday = isSunday(day);
      if (sunday && !data.isException) return "";
      shown++;

      var byKey = {};
      data.entries.forEach(function(e){ byKey[vpoEntryKey(e)] = e; });
      var entries;
      if (sunday) {
        entries = data.entries.slice();
      } else {
        entries = MASTER_VPO_FLEET.map(function(f){ return byKey[f.id] || { fleetId:f.id, usina1:"", usina2:"", status:"", obs:"" }; });
        data.entries.forEach(function(e){ if (!e.fleetId) entries.push(e); });
      }

      var refText = fmtBR(addDays(day,-1)) + " (" + weekdayLong(addDays(day,-1)) + ")";
      var rows = entries.map(function(e){
        var key = vpoEntryKey(e);
        var fleet = e.fleetId ? MASTER_VPO_FLEET.find(function(f){ return f.id === e.fleetId; }) : null;
        var statusMeta = VPO_STATUS_OPTS.find(function(o){ return o.value === (e.status||""); }) || VPO_STATUS_OPTS[0];
        var statusClass = statusMeta.tone || "";
        if (e.status === "emitido") vagg.emitido++;
        else if (e.status === "nao_precisa") vagg.feito++;
        else if (e.status === "conferir") vagg.conferir++;
        else if (e.status === "pendente") vagg.pendente++;
        var placa, motorista, carretas, fabrica;
        if (fleet){
          placa = '<td class="cell-strong '+statusClass+'" style="white-space:nowrap;">'+esc(fleet.placa)+'</td>';
          motorista = '<td class="muted" style="white-space:nowrap;">'+esc(fleet.motorista)+'</td>';
          carretas = '<td class="muted">'+esc(fleet.carretas.join(" / "))+'</td>';
          fabrica = '<td><span class="badge '+(FABRICA_TONE[fleet.fabrica]||"neutral")+'">'+esc(fleet.fabrica)+'</span></td>';
        } else {
          placa = vpoInput(iso, key, "placaLivre", e.placaLivre||"", "Placa", statusClass);
          motorista = vpoInput(iso, key, "motoristaLivre", e.motoristaLivre||"", "Nome do motorista");
          carretas = vpoInput(iso, key, "carretasLivre", e.carretasLivre||"", "Carreta(s), até 3, separadas por /");
          fabrica = vpoInput(iso, key, "fabricaLivre", e.fabricaLivre||"", "Fábrica");
        }
        var statusSelect = '<td style="padding:4px 6px;"><select data-iso="'+iso+'" data-key="'+esc(key)+'" data-field="status" class="status-select">' +
          VPO_STATUS_OPTS.map(function(o){ return '<option value="'+o.value+'"'+(o.value===(e.status||"")?" selected":"")+'>'+esc(o.label)+'</option>'; }).join("") +
          '</select></td>';
        // Coluna "Pedágio": uma etiqueta por trecho (Usina 1 e Usina 2 são
        // rotas independentes — uma pode ter pedágio e a outra não). A rota
        // completa por extenso já aparece escrita na própria opção
        // selecionada em Usina 1/Usina 2.
        function pedagioBadge(usinaKey, rotuloVazio){
          if (!usinaKey) return '<span class="faint" style="font-style:italic;font-size:11px;">'+esc(rotuloVazio)+'</span>';
          var r = rotaFromKey(usinaKey);
          return r
            ? '<span class="badge '+(PEDAGIO_TONE[r.pedagio]||"neutral")+'">'+esc(PEDAGIO_LABEL[r.pedagio]||"—")+'</span>'
            : '<span class="faint" style="font-style:italic;font-size:11px;">sem rota cadastrada</span>';
        }
        var rotaCell = '<td style="white-space:nowrap;"><div>U1: '+pedagioBadge(e.usina1, "—")+'</div>' +
          '<div style="margin-top:4px;">U2: '+pedagioBadge(e.usina2, "—")+'</div></td>';
        return '<tr>' + placa + motorista + carretas + fabrica +
          vpoUsinaSelect(iso, key, "usina1", e.usina1) +
          vpoUsinaSelect(iso, key, "usina2", e.usina2) +
          rotaCell +
          statusSelect +
          vpoInput(iso, key, "obs", e.obs, "ex: pedágio confirmado por telefone") + '</tr>';
      }).join("");

      return '<div class="prog-block'+(data.isException?" exception":"")+'" data-iso="'+iso+'">' +
        '<div class="prog-block-head"><div class="ref">'+esc(refText)+'</div><div class="title">VPO — PROGRAMAÇÃO DO DIA '+esc(fmtBR(day).toUpperCase())+' ('+esc(weekdayLong(day).toUpperCase())+')'+(data.isException?' · EXCEÇÃO':'')+'</div></div>' +
        (entries.length
          ? '<div class="table-wrap"><table><thead><tr><th>Placa <span style="opacity:.4;">▾</span></th><th>Motorista <span style="opacity:.4;">▾</span></th><th>Carreta(s) <span style="opacity:.4;">▾</span></th><th>Fábrica <span style="opacity:.4;">▾</span></th><th>Usina 1 (roteiro)</th><th>Usina 2 (roteiro)</th><th>Pedágio</th><th>Status VPO</th><th>Observação</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
          : '<p class="prog-empty">Nenhum veículo registrado para este dia.</p>') +
        '<div class="prog-add" data-iso="'+iso+'">+ adicionar veículo</div>' +
        '</div>';
    }).join("");

    el("vpoDayInfo").textContent = shown + " dia(s) exibido(s) de " + days.length + " selecionado(s)" + (days.length > shown ? " · domingo(s) sem VPO ocultado(s) automaticamente" : "");
    el("vpoBlocks").innerHTML = html || '<div class="notice"><h3>Nenhum dia para exibir</h3><p>O período selecionado só contém domingos sem VPO programado.</p></div>';

    el("vpoStats").innerHTML = '<div class="stat-grid">' +
      '<div class="stat" style="--stat-accent:var(--success);"><div class="stat-top"><span>Emitido</span><span class="stat-icn" style="background:var(--success-soft);color:var(--success);">✅</span></div><div class="stat-val">'+vagg.emitido+'</div></div>' +
      '<div class="stat" style="--stat-accent:var(--success);"><div class="stat-top"><span>Feito (sem pedágio)</span><span class="stat-icn" style="background:var(--success-soft);color:var(--success);">🟢</span></div><div class="stat-val">'+vagg.feito+'</div></div>' +
      '<div class="stat" style="--stat-accent:var(--warning);"><div class="stat-top"><span>Incerto — confirmar</span><span class="stat-icn" style="background:var(--warning-soft);color:var(--warning);">🕒</span></div><div class="stat-val">'+vagg.conferir+'</div></div>' +
      '<div class="stat" style="--stat-accent:var(--danger);"><div class="stat-top"><span>Pendente (tem pedágio)</span><span class="stat-icn" style="background:var(--danger-soft);color:var(--danger);">⚠️</span></div><div class="stat-val">'+vagg.pendente+'</div></div>' +
      '</div>';

    el("vpoBlocks").querySelectorAll("input[data-iso]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var entry = vpoGetOrCreateEntry(inp.dataset.iso, inp.dataset.key);
        entry[inp.dataset.field] = inp.value;
      });
    });
    el("vpoBlocks").querySelectorAll("select[data-iso]").forEach(function(sel){
      sel.addEventListener("change", function(){
        var entry = vpoGetOrCreateEntry(sel.dataset.iso, sel.dataset.key);
        entry[sel.dataset.field] = sel.value;
        // Trocando o roteiro da Usina 1, sugere o status automaticamente
        // conforme o pedágio daquele roteiro; o campo Status continua
        // editável manualmente a qualquer momento.
        if (sel.dataset.field === "usina1") applyAutoVpoStatus(entry);
        paintVpoBlocks();
      });
    });
    el("vpoBlocks").querySelectorAll(".prog-add").forEach(function(btn){
      btn.addEventListener("click", function(){
        var iso = btn.dataset.iso;
        if (!vpoScheduleByDate[iso]) vpoScheduleByDate[iso] = { isException:isSunday(fromISO(iso)), entries:[] };
        vpoScheduleByDate[iso].entries.push({usina1:"", usina2:"", status:"", obs:"", motoristaLivre:"", placaLivre:"", carretasLivre:"", fabricaLivre:"", __key:"extra-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)});
        paintVpoBlocks();
      });
    });
    el("vpoBlocks").querySelectorAll(".prog-block[data-iso]").forEach(function(block){
      xlEnhance(block, "vpo-" + block.dataset.iso);
    });
  }

  function dlHtml(data){
    if(!data) return '<p class="empty-note">Ainda não emitido — dados utilizados serão definidos na emissão (simulada).</p>';
    return '<div class="dl">' + Object.keys(data).map(function(k){
      return '<div class="dl-row"><span>'+esc(k)+'</span><span>'+esc(data[k])+'</span></div>';
    }).join("") + '</div>';
  }

  function openVpoDrawer(idx){
    var v = vpos[idx];
    el("drawerTitle").textContent = v.op;

  /* ---------- retrato do que está na tela, para saber o que mudou ---------- */
  function splitPos(s){ return String(s == null ? "" : s).split("/").map(function(x){ return x.trim(); }); }
