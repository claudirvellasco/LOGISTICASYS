        var job = jobs[j];
        try {
          await rpc(fn, { p_rows: job.ks.map(function(k){ return JSON.parse(cur[parte][k]); }), p_remove: job.rem.map(function(k){ return rowsOf(k, SNAP[parte][k]); }) });
          job.ks.forEach(function(k){ SNAP[parte][k] = cur[parte][k]; });
          job.rem.forEach(function(k){ delete SNAP[parte][k]; });
        } catch (e) { erros.push(e); }
      }
    }
    await lote("usinas", "sync_usinas", function(k, old){ return JSON.parse(old).usina; });
    await lote("notas", "sync_notas", function(k, old){ return JSON.parse(old).numero; });
    await lote("puzl", "sync_puzl", function(k, old){ var o = JSON.parse(old); return [o.documento, o.serie, o.central_entrada]; });

    // catálogo de cimentos: termos novos/alterados vão por RPC; remover um termo só o administrador consegue
    var upCat = [], remCat = [];
    keys("cat").forEach(function(k){ if (!mudou("cat", k)) return; if (cur.cat[k] == null) remCat.push(k); else upCat.push(k); });
    if (upCat.length){
      try { await rpc("sync_catalogo", { p_rows: upCat.map(function(k){ return JSON.parse(cur.cat[k]); }) }); upCat.forEach(function(k){ SNAP.cat[k] = cur.cat[k]; }); }
      catch (e) { erros.push(e); }
    }
    for (var ic = 0; ic < remCat.length; ic++){
      var kc = remCat[ic];
      try {
        var velho = JSON.parse(SNAP.cat[kc]);
        var rd = await sb.from("catalogo_cimento").delete().eq("termo", velho.termo).select();
        if (rd.error) throw rd.error;
        if (!rd.data || !rd.data.length) throw new Error("Só o administrador pode remover termos do catálogo.");
        delete SNAP.cat[kc];
      } catch (e) { erros.push(e); }
    }

    var diasProg = keys("prog").filter(function(k){ return mudou("prog", k); });
    for (var i = 0; i < diasProg.length; i++){
      (function(k){ })(diasProg[i]);
      var k = diasProg[i];
      await run("prog", k, function(){
        if (cur.prog[k] == null) return rpc("remover_dia_programacao", { p_data: k });
        var p = JSON.parse(cur.prog[k]);
        return rpc("salvar_dia_programacao", { p_data: k, p_ref: p.ref, p_exc: p.exc, p_itens: p.itens });
      });
    }
    var diasVpo = keys("vpo").filter(function(k){ return mudou("vpo", k); });
    for (var j2 = 0; j2 < diasVpo.length; j2++){
      var kv = diasVpo[j2];
      await run("vpo", kv, function(){
        if (cur.vpo[kv] == null) return rpc("salvar_dia_vpo", { p_data: kv, p_exc: false, p_entradas: [] });
        var p = JSON.parse(cur.vpo[kv]);
        return rpc("salvar_dia_vpo", { p_data: kv, p_exc: p.exc, p_entradas: p.entradas });
      });
    }
    if (erros.length) throw erros[0];
  }
  function setSyncState(st, msg){
    syncState = st; syncErro = msg || "";
    var c = el("syncChip"); if (!c) return;
    var txt = { salvo: "● Salvo", salvando: "◌ Salvando…", pendente: "◌ Alterações pendentes", erro: "⚠ Não salvou — tentar de novo", leitura: "Somente leitura" }[st];
    c.textContent = txt; c.title = msg || "";
    c.style.color = st === "erro" ? "var(--danger)" : (st === "salvo" ? "var(--success)" : "var(--warning)");
    c.style.cursor = st === "erro" ? "pointer" : "default";
  }
  function syncNow(){
    if (!ME || ME.papel === "leitura") return syncChain;
    syncChain = syncChain.then(async function(){
      setSyncState("salvando");
      try { await syncOnce(); setSyncState("salvo"); }
      catch (e) { setSyncState("erro", dbErr(e)); if (/sess/i.test(dbErr(e))) { try { await sb.auth.signOut(); } catch (x) { } } }
    });
    return syncChain;
  }
  function temMudanca(){
    if (!SNAP) return false;
    var cur = takeSnap();
    return ["prog", "vpo", "notas", "puzl", "usinas", "cat"].some(function(parte){
      var ks = {}; Object.keys(SNAP[parte]).concat(Object.keys(cur[parte])).forEach(function(k){ ks[k] = 1; });
      return Object.keys(ks).some(function(k){ return (cur[parte][k] == null ? null : cur[parte][k]) !== (SNAP[parte][k] == null ? null : SNAP[parte][k]); });
    });
  }
  function scheduleSync(ev){
    if (!ME || ME.papel === "leitura" || !SNAP) return;
    var t = ev && ev.target, ev_ = ev && ev.type;
    if (t && t.closest && t.closest("#btnSair,#btnAtualizar,#syncChip,#loginForm")) return;
    if (ev_ !== "click" && syncState === "salvo") setSyncState("pendente");
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){
      if (syncState === "salvando") { syncTimer = setTimeout(function(){ scheduleSync(); }, 600); return; }
      try {
        if (syncState === "erro" || temMudanca()) syncNow();
        else if (syncState === "pendente") setSyncState("salvo");
      } catch (e) { setSyncState("erro", "Erro interno ao conferir alterações: " + (e && e.message)); }
    }, 1200);
  }
  ["click", "change", "input", "keyup", "paste", "drop"].forEach(function(evn){ document.addEventListener(evn, scheduleSync, true); });
  window.addEventListener("beforeunload", function(ev){
    if (!ME || ME.papel === "leitura") return;
    if (syncState === "salvando" || syncState === "erro" || temMudanca()){ ev.preventDefault(); ev.returnValue = ""; }
  });
  document.addEventListener("click", function(ev){ if (ev.target && ev.target.id === "syncChip" && syncState === "erro") syncNow(); });

  /* ---------- entrar, sair e iniciar a tela ---------- */
  function toEmail(u){
    u = String(u || "").trim().toLowerCase();
    if (u.indexOf("@") >= 0) return u;
    u = u.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9._-]/g, "");
    return u + "@" + CFG.dominioLogin;
  }
  function loginMsg(t, bad){ var m = el("loginMsg"); m.textContent = t; m.style.color = bad ? "var(--danger)" : ""; }
  function overlay(on, txt){
    var o = el("loadingOverlay"); o.style.display = on ? "flex" : "none"; if (txt) o.firstElementChild.textContent = txt;
  }
  var bootJa = false;
  function bootRender(){
    renderProgramacaoCimento(); renderBaseDados(); renderNotasSefaz(); renderLancamentosPuzl(); renderControlePedidos(); renderConsultas();
    renderDashboard(); renderOperacoes(); renderVpo(); renderExcecoes(); renderAuditoria();
    if (!bootJa) { el("viewCrumb").innerHTML = CRUMBS["programacao-cimento"]; bootJa = true; }
  }
  async function entrar(user){
    var r = await sb.from("membros").select("empresa_id,papel,nome").eq("user_id", user.id).maybeSingle();
    if (r.error || !r.data){
      await sb.auth.signOut();
      el("login").style.display = "flex"; el("app").classList.remove("active");
      loginMsg(r.error ? dbErr(r.error) : "Este usuário não tem acesso. Fale com o administrador.", true);
      return false;
    }
    ME = { id: user.id, nome: r.data.nome || user.email, papel: r.data.papel, empresa_id: r.data.empresa_id };
    el("whoName").textContent = ME.nome;
    el("whoRole").textContent = { admin: "Administrador", operador: "Operador", leitura: "Somente leitura" }[ME.papel] || ME.papel;
    el("whoAvatar").textContent = ME.nome.slice(0, 2).toUpperCase();
    el("login").style.display = "none"; el("app").classList.add("active");
    overlay(true, "Carregando dados…");
    try { await hydrate(); }
    catch (e) { overlay(false); el("app").classList.remove("active"); el("login").style.display = "flex"; loginMsg("Não foi possível carregar os dados: " + dbErr(e), true); return false; }
    bootRender();
    document.body.classList.toggle("somente-leitura", ME.papel === "leitura");
    setSyncState(ME.papel === "leitura" ? "leitura" : "salvo");
    overlay(false);
    return true;
  }
  el("loginForm").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var u = el("loginUser").value, p = el("loginPass").value, go = ev.target.querySelector("button[type=submit]");
    if (!u.trim() || !p){ loginMsg("Informe usuário e senha.", true); return; }
    go.disabled = true; loginMsg("Entrando…");
    var r;
    try { r = await sb.auth.signInWithPassword({ email: toEmail(u), password: p }); } catch (e) { r = { error: { message: "Failed to fetch" } }; }
    go.disabled = false;
    if (r.error){ loginMsg(/invalid login/i.test(r.error.message) ? "Usuário ou senha incorretos." : dbErr(r.error), true); return; }
    el("loginPass").value = ""; loginMsg("");
    await entrar(r.data.user);
  });
  el("btnSair").addEventListener("click", async function(){
    if ((syncState === "pendente" || syncState === "salvando" || syncState === "erro" || temMudanca()) && !window.__sairMesmoAssim){
      window.__sairMesmoAssim = true; el("btnSair").textContent = "Há alterações sem salvar — clique de novo para sair"; return;
    }
    window.__sairMesmoAssim = true; try { await sb.auth.signOut(); } catch (e) { }
    location.reload();
  });
  el("btnAtualizar").addEventListener("click", async function(){
    if (syncState === "pendente" || syncState === "salvando"){ await syncNow(); }
    if (syncState === "erro"){ alert_("Há alterações que não foram salvas. Resolva isso antes de atualizar."); return; }
    overlay(true, "Atualizando…");
    try { await hydrate(); bootRender(); } catch (e) { alert_("Não foi possível atualizar: " + dbErr(e)); }
    overlay(false);
  });
  function alert_(t){ var c = el("syncChip"); var old = c.textContent; c.textContent = t; setTimeout(function(){ setSyncState(syncState, syncErro); }, 4000); }
  window.__app = { syncNow: syncNow, takeSnap: takeSnap };

  (async function iniciar(){
    try {
      var s = await sb.auth.getSession();
      if (s.data && s.data.session){ el("login").style.display = "none"; overlay(true, "Carregando…"); var ok = await entrar(s.data.session.user); if (!ok) overlay(false); }
    } catch (e) { overlay(false); }
  })();

})();
</script>
