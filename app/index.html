<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concrelagos Logística</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    /* Dark corporativo elegante — padrão ERP/logística premium. */
    --bg:#0b0f15; --surface:#121821; --surface-2:#182029; --surface-3:#1c2530;
    --border:#232c38; --border-strong:#374353;
    --text:#e8ecf2; --text-muted:#98a5b6; --text-faint:#65727f;
    --accent:#4f8fe3; --accent-strong:#8bbdf2; --accent-soft:#15263c;
    --success:#38c793; --success-soft:#0f2620;
    --warning:#e7ac55; --warning-soft:#2c2211;
    --danger:#f0748a; --danger-soft:#2f1620;
    --info:#5cb2ea; --info-soft:#122334;
    --neutral:#9aa6b6; --neutral-soft:#1a212b;
    --shadow:0 4px 14px rgba(0,0,0,.28), 0 1px 3px rgba(0,0,0,.35);
    --radius:10px;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f4f8; --surface-3:#e9edf2;
    --border:#e2e6ec; --border-strong:#cbd2dc;
    --text:#1c2530; --text-muted:#65707d; --text-faint:#98a2ae;
    --accent:#2d5482; --accent-strong:#1e324c; --accent-soft:#e8eef6;
    --success:#0d7a4f; --success-soft:#e5f5ee;
    --warning:#9a5b06; --warning-soft:#fdf1e0;
    --danger:#b3273f; --danger-soft:#fbe7ea;
    --info:#1c6ea4; --info-soft:#e6f2fa;
    --neutral:#4b5563; --neutral-soft:#eef0f2;
    --shadow:0 1px 2px rgba(20,30,45,.06), 0 1px 3px rgba(20,30,45,.08);
    --radius:10px;
    color-scheme:light;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.5; letter-spacing:.1px;
  }
  h1,h2,h3{margin:0; text-wrap:balance;}
  button{font-family:inherit; cursor:pointer;}
  table{border-collapse:collapse; width:100%;}
  ::selection{background:var(--accent-soft);}

  /* ---------- Login ---------- */
  #login{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 24px;
  }
  .login-brand{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:22px;}
  .login-mark{
    width:44px; height:44px; border-radius:10px; background:var(--accent-strong); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; margin-bottom:10px;
  }
  .login-brand h1{font-size:17px; font-weight:700;}
  .login-brand p{margin:2px 0 0; font-size:13px; color:var(--text-muted);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; font-weight:600; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .field-input{
    display:flex; align-items:center; gap:8px; border:1px solid var(--border-strong); border-radius:6px;
    padding:9px 11px; background:var(--surface);
  }
  .field-input input{border:none; outline:none; background:transparent; font-size:13px; width:100%; color:var(--text);}
  .btn-primary{
    width:100%; background:var(--accent-strong); color:#fff; border:none; border-radius:6px;
    padding:10px; font-size:13px; font-weight:600; margin-top:4px;
  }
  .btn-primary:hover{opacity:.92;}
  .login-note{margin-top:12px; text-align:center; font-size:11px; color:var(--text-faint);}

  /* ---------- Shell ---------- */
  #app{display:none; min-height:100vh;}
  #app.active{display:flex;}
  .sidebar{
    width:252px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
  }
  .sidebar-head{display:flex; align-items:center; gap:11px; padding:18px 16px; border-bottom:1px solid var(--border);}
  .sidebar-mark{
    width:34px; height:34px; border-radius:8px; background:linear-gradient(155deg, var(--accent) 0%, var(--accent-strong) 130%);
    color:#0b0f15; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none;
    box-shadow:0 2px 8px rgba(79,143,227,.35);
  }
  .sidebar-head strong{display:block; font-size:13.5px; letter-spacing:.01em;}
  .sidebar-head span{display:block; font-size:10.5px; color:var(--text-faint); margin-top:1px;}
  .nav{flex:1; overflow-y:auto; padding:14px 10px;}
  .nav-group{margin-bottom:18px;}
  .nav-group-label{padding:0 10px 8px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); cursor:pointer; user-select:none; display:flex; align-items:center; gap:5px;}
  .nav-group-label:hover{color:var(--text-muted);}
  .nav-group-chevron{display:inline-block; font-size:8px; transition:transform .15s; flex:none;}
  .nav-group.collapsed .nav-group-chevron{transform:rotate(-90deg);}
  .nav-group.collapsed .nav-item{display:none;}
  .nav-group.dim .nav-item{color:var(--text-faint);}
  .nav-item{
    position:relative; display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none;
    padding:9px 10px 9px 12px; border-radius:7px; font-size:13px; font-weight:500; color:var(--text-muted); margin-bottom:2px;
    transition:background .12s, color .12s;
  }
  .nav-item .ic{width:17px; text-align:center; font-size:13px; flex:none; opacity:.8;}
  .nav-item .dot{width:6px; height:6px; border-radius:50%; background:var(--border-strong); flex:none;}
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}
  .nav-item.active::before{content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--accent);}
  .nav-item.active .dot{background:var(--accent);}
  .nav-item.active .ic{opacity:1;}
  .sidebar-foot{padding:13px 16px; border-top:1px solid var(--border); font-size:10.5px; color:var(--text-faint); line-height:1.45;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column; height:100vh;}
  .topbar{
    min-height:58px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; border-bottom:1px solid var(--border); background:var(--surface);
  }
  .topbar-title{padding:10px 0;}
  .topbar h1{font-size:15.5px; font-weight:700; letter-spacing:.01em;}
  .topbar .crumb{margin:2px 0 0; font-size:11px; color:var(--text-faint);}
  .topbar .crumb b{color:var(--text-muted); font-weight:600;}
  .user-chip{display:flex; align-items:center; gap:9px;}
  .avatar{width:29px; height:29px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; border:1px solid var(--border-strong);}
  .user-chip .who{font-size:11.5px; line-height:1.3;}
  .user-chip .who b{display:block; font-weight:600; color:var(--text);}
  .user-chip .who small{color:var(--text-faint);}

  .content{flex:1; overflow-y:auto; padding:24px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- Components ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:15px 18px; border-bottom:1px solid var(--border);}
  .card-head h2{font-size:13.5px; font-weight:700; letter-spacing:.01em;}
  .card-head p{margin:3px 0 0; font-size:11.5px; color:var(--text-muted);}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(155px,1fr)); gap:12px; margin-bottom:18px;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:15px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
  .stat::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--stat-accent, var(--border-strong));}
  .stat-top{display:flex; align-items:center; justify-content:space-between;}
  .stat-top span{font-size:10.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;}
  .stat-icn{width:27px; height:27px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:13px; flex:none;}
  .stat-val{margin-top:9px; font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
  .stat-sub{margin-top:2px; font-size:10.5px; color:var(--text-faint);}

  .badge{display:inline-flex; align-items:center; gap:6px; padding:3.5px 10px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap; letter-spacing:.01em;}
  .badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none;}
  .badge.neutral{background:var(--neutral-soft); color:var(--neutral);}
  .badge.info{background:var(--info-soft); color:var(--info);}
  .badge.warning{background:var(--warning-soft); color:var(--warning);}
  .badge.danger{background:var(--danger-soft); color:var(--danger);}
  .badge.success{background:var(--success-soft); color:var(--success);}

  th{text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:11px 16px; background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap;}
  td{padding:11px 16px; font-size:12.5px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr{transition:background .1s;}
  tbody tr:hover td{background:var(--surface-2);}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;}
  .muted{color:var(--text-muted);}
  .faint{color:var(--text-faint);}
  .cell-strong{font-weight:700;}

  .filters{display:flex; flex-wrap:wrap; gap:12px; padding:15px 18px; align-items:flex-end;}
  .filter-field{display:flex; flex-direction:column; gap:5px;}
  .filter-field span{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint);}
  select{
    height:32px; border-radius:7px; border:1px solid var(--border-strong); background:var(--surface);
    color:var(--text); font-size:12.5px; padding:0 8px;
  }
  .filter-count{margin-left:auto; font-size:11.5px; color:var(--text-faint); align-self:center;}

  .stack{display:flex; flex-direction:column; gap:12px;}
  .exc-card{padding:16px 18px; display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; align-items:flex-start;}
  .exc-main{min-width:240px; flex:1;}
  .exc-title{display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;}
  .exc-title h3{font-size:13px; font-weight:600;}
  .exc-detail{font-size:12px; color:var(--text-muted); margin:2px 0;}
  .exc-meta{display:flex; gap:16px; font-size:11px; color:var(--text-faint); margin-top:6px; flex-wrap:wrap;}
  .exc-actions{display:flex; flex-wrap:wrap; gap:6px;}
  .btn-ghost{
    display:flex; align-items:center; gap:5px; border:1px solid var(--border-strong); background:var(--surface);
    border-radius:7px; padding:6px 10px; font-size:11.5px; font-weight:600; color:var(--text-muted); transition:border-color .12s, color .12s, background .12s;
  }
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft);}
  .btn-primary{transition:opacity .12s, box-shadow .12s; box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .section-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin:0 0 10px;}

  .notice{
    border:1px dashed var(--border-strong); border-radius:var(--radius); background:var(--surface-2);
    padding:52px 24px; text-align:center; color:var(--text-muted);
  }
  .notice h3{font-size:13.5px; color:var(--text); margin-bottom:6px;}
  .notice p{font-size:12.5px; max-width:420px; margin:0 auto;}

  .banner{padding:14px 18px; font-size:12.5px; color:var(--text-muted); line-height:1.55;}
  .banner b{color:var(--text);}

  /* ---------- Drawer ---------- */
  .overlay{position:fixed; inset:0; background:rgba(15,20,28,.4); display:none; z-index:20;}
  .overlay.active{display:block;}
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:min(440px,100%); background:var(--surface);
    border-left:1px solid var(--border); box-shadow:-8px 0 24px rgba(15,20,28,.15); z-index:21;
    transform:translateX(100%); transition:transform .2s ease; display:flex; flex-direction:column;
  }
  .drawer.active{transform:translateX(0);}
  .drawer-head{display:flex; justify-content:space-between; align-items:flex-start; padding:16px 20px; border-bottom:1px solid var(--border);}
  .drawer-head h2{font-size:14px; font-weight:700;}
  .drawer-head p{margin:2px 0 0; font-size:11.5px; color:var(--text-muted);}
  .drawer-close{border:none; background:none; font-size:18px; line-height:1; color:var(--text-faint); padding:4px;}
  .drawer-body{flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:18px;}
  .sec-title{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); margin-bottom:7px;}
  .dl{border:1px solid var(--border); border-radius:6px; overflow:hidden;}
  .dl-row{display:flex; justify-content:space-between; gap:10px; padding:8px 12px; font-size:12.5px; border-bottom:1px solid var(--border);}
  .dl-row:last-child{border-bottom:none;}
  .dl-row span:first-child{color:var(--text-muted);}
  .dl-row span:last-child{font-weight:600; text-align:right;}
  .timeline{list-style:none; margin:0; padding:0 0 0 14px; border-left:1px solid var(--border); display:flex; flex-direction:column; gap:12px;}
  .timeline li{position:relative; font-size:12.5px;}
  .timeline li::before{content:""; position:absolute; left:-18px; top:5px; width:7px; height:7px; border-radius:50%; background:var(--accent);}
  .timeline .when{color:var(--text-faint); font-size:11px; margin-top:1px;}
  .occ{background:var(--danger-soft); color:var(--danger); border-radius:6px; padding:8px 10px; font-size:11.5px; margin-bottom:6px;}
  .empty-note{font-size:11.5px; font-style:italic; color:var(--text-faint);}

  /* ---------------- Date range picker ---------------- */
  .daterange{position:relative; display:inline-block;}
  .daterange-btn{display:flex; align-items:center; gap:8px; border:1px solid var(--border-strong); background:var(--surface); border-radius:6px; padding:8px 12px; font-size:12.5px; font-weight:600; color:var(--text);}
  .daterange-btn:hover{border-color:var(--accent);}
  .daterange-panel{position:absolute; top:calc(100% + 6px); left:0; z-index:15; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:14px; display:none; width:300px;}
  .daterange-panel.open{display:block;}
  .dr-quick{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
  .dr-quick button{border:1px solid var(--border-strong); background:var(--surface); border-radius:6px; padding:6px 10px; font-size:11.5px; font-weight:600; color:var(--text-muted);}
  .dr-quick button:hover, .dr-quick button.active{border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft);}
  .dr-hint{font-size:10.5px; color:var(--text-faint); margin:-6px 0 10px;}
  .dr-cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .dr-cal-head button{border:none; background:none; font-size:14px; color:var(--text-muted); padding:4px 8px; border-radius:6px;}
  .dr-cal-head button:hover{background:var(--surface-2);}
  .dr-cal-head span{font-size:12.5px; font-weight:700; text-transform:capitalize;}
  .dr-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center;}
  .dr-grid .dow{font-size:10px; color:var(--text-faint); font-weight:700; padding:4px 0;}
  .dr-grid .dow.sun{color:var(--danger);}
  .dr-day{padding:6px 0; font-size:11.5px; border-radius:6px; border:none; background:none; color:var(--text);}
  .dr-day.sun{color:var(--danger); opacity:.8;}
  .dr-day.muted{color:var(--text-faint);}
  .dr-day:hover{background:var(--surface-2);}
  .dr-day.in-range{background:var(--accent-soft); border-radius:0;}
  .dr-day.range-start{border-radius:6px 0 0 6px;}
  .dr-day.range-end{border-radius:0 6px 6px 0;}
  .dr-day.range-start,.dr-day.range-end,.dr-day.single{background:var(--accent-strong); color:#fff;}
  .dr-apply{width:100%; margin-top:10px;}

  /* ---------------- Programação (blocos por dia) ---------------- */
  .prog-block{border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:16px; box-shadow:var(--shadow); background:var(--surface);}
  .prog-block-head{display:grid; grid-template-columns:200px 1fr; background:var(--surface-2); border-bottom:1px solid var(--border);}
  .prog-block-head .ref{padding:9px 14px; font-size:11px; color:var(--text-muted); border-right:1px solid var(--border); display:flex; align-items:center;}
  .prog-block-head .title{padding:9px 14px; font-size:12.5px; font-weight:700; text-align:center; color:var(--text); display:flex; align-items:center; justify-content:center; letter-spacing:.02em;}
  .prog-block.exception .prog-block-head{background:var(--warning-soft);}
  .prog-block.exception .prog-block-head .ref{border-color:rgba(255,255,255,.06); color:var(--warning);}
  .prog-add{padding:10px 14px; font-size:12px; font-weight:600; color:var(--accent-strong); cursor:pointer; border-top:1px solid var(--border); transition:background .12s;}
  .prog-add:hover{background:var(--accent-soft);}
  .prog-empty{padding:16px 14px; font-size:12px; color:var(--text-faint); font-style:italic;}
  .multi-field{display:flex; flex-direction:column; gap:3px;}
  .multi-row{display:flex; align-items:center; gap:4px;}
  .multi-add-btn{flex:0 0 auto; width:20px; height:20px; line-height:1; border:1px dashed var(--border-strong); border-radius:5px; background:transparent; color:var(--text-faint); cursor:pointer; font-size:13px; font-weight:700; padding:0;}
  .multi-add-btn:hover{color:var(--accent-strong); border-color:var(--accent);}
  .multi-remove-btn{flex:0 0 auto; width:20px; height:20px; line-height:1; border:1px solid transparent; border-radius:5px; background:transparent; color:var(--text-faint); cursor:pointer; font-size:13px; font-weight:700; padding:0;}
  .multi-remove-btn:hover{color:#e05555; border-color:#e05555;}
  td.usina-ok{background:var(--success-soft) !important;}
  td.usina-conferir{background:var(--warning-soft) !important;}
  td.usina-info{background:var(--info-soft) !important;}
  td.usina-danger{background:var(--danger-soft) !important;}
  .pedidos-tabs{display:flex; flex-wrap:wrap; gap:7px; padding:15px 18px; border-bottom:1px solid var(--border);}
  .pedidos-tabs button{border:1px solid var(--border-strong); background:var(--surface-2); border-radius:99px; padding:6.5px 14px; font-size:12px; font-weight:600; color:var(--text-muted); transition:border-color .12s, color .12s, background .12s;}
  .pedidos-tabs button:hover{color:var(--text);}
  .pedidos-tabs button.active{border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft);}
  .status-select{height:30px; border-radius:6px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text); font-size:11.5px; padding:0 6px; width:100%;}
  .import-cards-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:16px; margin-bottom:16px;}
  .import-card{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column;}
  .import-card-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .import-card-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;}
  .import-card-title{font-size:13.5px; font-weight:700; color:var(--text); line-height:1.2;}
  .import-card-subtitle{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint);}
  .import-card-desc{font-size:11.5px; color:var(--text-muted); margin:0 0 12px; line-height:1.5;}
  .import-dropzone{border:1.5px dashed var(--border-strong); border-radius:var(--radius); padding:16px 10px; text-align:center; cursor:pointer; color:var(--text-faint); font-size:11.5px; display:block;}
  .import-dropzone:hover{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);}
  .import-dropzone.dragover{border-color:var(--accent-strong); background:var(--accent-soft); color:var(--accent-strong);}
  .import-dropzone .icon{font-size:18px; display:block; margin-bottom:6px;}
  .import-card.disabled{opacity:.65;}
  .import-card.disabled .import-dropzone{cursor:not-allowed;}

  // o nome da usina, a pessoa escolhe direto "fábrica x usina" (cada usina
  // pode ter mais de uma fábrica de origem). O valor guardado no campo é uma
  // chave "USINA||FÁBRICA" — routeKey/parseRouteKey convertem entre os dois.
  function routeKey(usina, fabrica){ return usina + "||" + fabrica; }
  function parseRouteKey(key){
    var i = (key || "").indexOf("||");
    if (i === -1) return { usina: key || "", fabrica: "" };
    return { usina: key.slice(0, i), fabrica: key.slice(i + 2) };
  }
  function rotaFromKey(key){
    if (!key) return null;
    var p = parseRouteKey(key);
    var rotas = ROTAS_POR_USINA[p.usina];
    if (!rotas) return null;
    return rotas.find(function(r){ return r.fabrica === p.fabrica; }) || null;
  }

  function applyAutoVpoStatus(entry){

    else if (st === "incerto") entry.status = "conferir";
    else entry.status = "pendente";
  }

  // Liga o nome do fornecedor como ele aparece na nota do SEFAZ (coluna
  // "Nome", ex: "CSN CIMENTOS BRASIL S.A.") ao fornecedor já cadastrado aqui
  // (ex: "CSN") — por aproximação de texto (contém o nome curto), a mesma
  // lógica que SEFAZ_PARSERS já usa pra identificar o fornecedor.
  // "aliases" cobre casos em que o nome real do fornecedor (razão social,
  // filial) não tem nenhuma relação textual óbvia com o nome curto cadastrado
  // (ex: "CONCRELAGOS CONCRETO S/A FILIAL" só bate com "Concrelagos" pelo
  // alias — o nome cadastrado é "Concrelagos (transferência entre filiais)",
  // que não é substring de nada real) — checado antes do match por nome.
  function fabricaEntryForFornecedor(fornecedorNF){
    var alvo = normalizeMaterial(fornecedorNF);
    if (!alvo) return null;
    var porAlias = FABRICAS_CATALOGO.find(function(f){
      return (f.aliases||[]).some(function(a){ return alvo.indexOf(normalizeMaterial(a)) !== -1; });
    });
    if (porAlias) return porAlias;
    return FABRICAS_CATALOGO.find(function(f){
      var nome = normalizeMaterial(f.fornecedor);
      return nome && (alvo.indexOf(nome) !== -1 || nome.indexOf(alvo) !== -1);
    }) || null;
  }
  // Rótulo único "Fornecedor — Material" — é isso que fica salvo no campo
  // fábrica da Programação (continua uma string, então tudo que já lê esse
  // campo — filtros, exportação — segue funcionando sem mudança).
  function fabricaRotulo(fornecedor, material){ return fornecedor + " — " + material; }
  function fabricaSelectOptionsHtml(selecionado){
    var opts = '<option value="">—</option>' + FABRICAS_CATALOGO.map(function(f){
      return '<optgroup label="'+esc(f.fornecedor)+'">' + f.materiais.map(function(mat){
        var rotulo = fabricaRotulo(f.fornecedor, mat);
        return '<option value="'+esc(rotulo)+'"'+(rotulo===selecionado?" selected":"")+'>'+esc(mat)+'</option>';
      }).join("") + '</optgroup>';
    }).join("");
    // Valor vindo de uma importação (ou digitado antes de existir essa Base
    // de Fábricas) que não bate com nenhuma opção cadastrada: em vez de sumir
    // (select cairia no "—" sem nada marcado, perdendo o dado visualmente),
    // aparece como uma opção extra destacada, com o texto original completo
    // — editável depois, só que sem perder a informação até lá.
    if (selecionado && !FABRICAS_CATALOGO.some(function(f){ return f.materiais.some(function(mat){ return fabricaRotulo(f.fornecedor, mat) === selecionado; }); })){
      opts = '<option value="'+esc(selecionado)+'" selected>⚠️ '+esc(selecionado)+' (não reconhecido)</option>' + opts;
    }
    return opts;
  }

  /* ---------------- Controle de Pedidos de Cimento ---------------- */
  // Conferência automática: cada "entrada" (nota lançada no sistema quando a
  // carreta chega) é cruzada contra a Programação de Cimento (cementScheduleByDate)
  // por DATA + FÁBRICA (+ Nº DO PEDIDO quando disponível), já que é isso que
  // temos garantido na programação. Estrutura de campos baseada na planilha real
  // "RESUMO DE ENTRADAS" (Central Entrada, Data de Entrada, Fornecedor/Fábrica,
  // Documento, Quantidade) — os campos de CNPJ, valores e frete da planilha
  // original são dados financeiros/sensíveis e NÃO entram aqui, propositalmente:
  // não são necessários para conferir se a nota bate com a programação.
  var SITUACAO_OPTS = [
    {value:"confere", label:"Confere", tone:"usina-ok"},
    {value:"sem_certeza", label:"Sem certeza", tone:"usina-conferir"},
    {value:"data_incorreta", label:"Data incorreta", tone:"usina-info"},
    {value:"nao_realizado", label:"Não foi realizado pedido", tone:"usina-danger"}
  ];
  // cementEntradas NÃO é mais cadastrada manualmente: é derivada de
  // puzlEntradas (ver recomputeEntradasFromPuzl, definida mais abaixo, depois
  // que puzlEntradas/usinasCadastro/cementNFes já existem). Começa vazia aqui
  // e é preenchida na primeira chamada de recomputeEntradasFromPuzl().
  var cementEntradas = [];

  function fabricaListFrom(str){
    return String(str||"").split("/").map(function(s){ return s.trim().toUpperCase(); }).filter(Boolean);
  }
  // Compara um valor de fábrica da Programação (agora padronizado como
  // "FORNECEDOR — MATERIAL", vindo da Base de Fábricas) contra o texto livre
  // que ainda vem de Entradas (ex: "CSN", "CP3", "TUPI" — esse campo não foi
  // padronizado nesta etapa). Aceita batida exata (compatível com dado antigo
  // que não segue o formato novo) OU o alvo batendo com o fornecedor/material
  // do lado novo, pra não perder o vínculo por causa da mudança de formato.
  // Aceita o formato "FORNECEDOR — MATERIAL" (padrão novo, vindo da Base de
  // Fábricas) em QUALQUER um dos dois lados da comparação — tanto no item da
  // Programação quanto no texto de fábrica da entrada (agora derivado da
  // PUZL, ver recomputeEntradasFromPuzl) — já que a Programação antiga ainda
  // guarda só o código curto (ex: "CSN", "TUPI", "LIZ").
  function fabricaPartes(s){
    var i = s.indexOf(" — ");
    return i === -1 ? null : {fornecedor: s.slice(0, i), material: s.slice(i + 3)};
  }
  function fabricaMatches(itemProg, alvo){
    var item = String(itemProg||"").trim();
    alvo = String(alvo||"").trim();
    if (!alvo) return false;
    if (item === alvo) return true;
    var itemN = normalizeMaterial(item), alvoN = normalizeMaterial(alvo);
    var pItem = fabricaPartes(item);
    if (pItem){
      var fornN = normalizeMaterial(pItem.fornecedor);
      if (fornN && alvoN && (fornN === alvoN || fornN.indexOf(alvoN) !== -1 || alvoN.indexOf(fornN) !== -1)) return true;
      if (normalizeMaterial(pItem.material) === alvoN) return true;
    }
    var pAlvo = fabricaPartes(alvo);
    if (pAlvo){
      var fornN2 = normalizeMaterial(pAlvo.fornecedor);
      if (fornN2 && itemN && (fornN2 === itemN || fornN2.indexOf(itemN) !== -1 || itemN.indexOf(fornN2) !== -1)) return true;
      if (normalizeMaterial(pAlvo.material) === itemN) return true;
    }
    return false;
  }
  function pedidoListFrom(str){
    return String(str||"").split("/").map(function(s){ return s.trim(); }).filter(function(s){ return s && s!=="—"; });
  }
  // Compara pedidos ignorando zeros à esquerda: a Programação às vezes guarda
  // o número "cheio" (ex: "0009011287", como vem de alguma planilha/sistema
  // interno) e o SEFAZ traz o mesmo pedido sem os zeros (ex: "9011287") — pra
  // não perder o vínculo por causa disso, os dois lados são normalizados
  // antes de comparar. Pedido não-numérico (raro) fica como está.
  function normalizePedidoNum(s){
    var t = String(s||"").trim();
    if (!/^\d+$/.test(t)) return t;
    var sem = t.replace(/^0+/, "");
    return sem || "0";
  }
  // Cruza uma entrada contra a Programação de Cimento (cementScheduleByDate).
  // Prioridade: (1) mesma data + nº de pedido batendo com um item da programação
  // (mesmo que a usina não bata) -> confere; (2) mesma data + fábrica + usina ->
  // confere; (3) mesma data + fábrica só (usina não bate ou pedido ausente) ->
  // sem_certeza; (4) fábrica aparece em programação de até 3 dias de distância
  // (outra data) -> data_incorreta; (5) nada encontrado -> nao_realizado.
  function matchProgramacao(entrada){
    var fabricaAlvo = String(entrada.fabrica||"").trim().toUpperCase();
    var pedidoAlvo = String(entrada.pedido||"").trim();
    var day = cementScheduleByDate[entrada.data];
    if (day){
      if (pedidoAlvo){
        var porPedido = day.entries.find(function(e){ return pedidoListFrom(e.pedido).indexOf(pedidoAlvo) !== -1; });
        if (porPedido) return {situacao:"confere", entry:porPedido, dataProgramada:entrada.data};
      }
      var porFabrica = day.entries.filter(function(e){ return fabricaListFrom(e.fabrica).some(function(f){ return fabricaMatches(f, fabricaAlvo); }); });
      if (porFabrica.length){
        var porUsina = porFabrica.find(function(e){ return String(e.usina||"").trim().toUpperCase() === String(entrada.usina||"").trim().toUpperCase(); });
        if (porUsina) return {situacao:"confere", entry:porUsina, dataProgramada:entrada.data};
        return {situacao:"sem_certeza", entry:porFabrica[0], dataProgramada:entrada.data};
      }
    }
    var base = fromISO(entrada.data);
    for (var d=-3; d<=3; d++){
      if (d===0) continue;
      var iso2 = toISO(addDays(base, d));
      var day2 = cementScheduleByDate[iso2];
      if (!day2) continue;
      var found2 = day2.entries.filter(function(e){ return fabricaListFrom(e.fabrica).some(function(f){ return fabricaMatches(f, fabricaAlvo); }); });
      if (found2.length) return {situacao:"data_incorreta", entry:found2[0], dataProgramada:iso2};
    }
    return {situacao:"nao_realizado", entry:null, dataProgramada:null};
  }

  /* ---------------- Filtro estilo Excel (genérico, reaproveitável) ----------------
     Usado em todas as tabelas grandes do sistema (Programação, Controle de
     Pedidos, Base de Dados, Consultas, VPO). Cada tabela chama xlEnhance()
     logo depois de montar seu HTML, passando uma "key" estável (pra manter o
     filtro/ordenação ao repintar a tela) e, opcionalmente, os índices de
     colunas que não devem ter filtro (ex: coluna de botão de excluir). */
  var xlState = {}; // key -> { filters:{colIdx:Set}, sort:{col,dir} }
  var xlOpenKey = null; // popover aberto no momento (fecha ao clicar fora)

  function xlGetState(key){
    if (!xlState[key]) xlState[key] = { filters:{}, sort:null };
    return xlState[key];
  }

  // Valor "comparável" de uma célula: se tiver input/select dentro, usa o
  // valor atual deles (é o que o usuário está vendo/editando); senão, o texto.
  function xlCellValue(td){
    if (!td) return "";
    var inputs = td.querySelectorAll("input");
    // Célula com múltiplos campos (ex: até 3 placas/fábricas/pedidos numa só
    // coluna) — junta os valores preenchidos, igual ao que é salvo no dado.
    if (inputs.length > 1) return Array.prototype.map.call(inputs, function(i){ return i.value; }).filter(Boolean).join(" / ");
    if (inputs.length === 1) return inputs[0].value || "";
    var sel = td.querySelector("select");
    if (sel) return sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : "";
    return (td.textContent || "").trim();
  }

  function xlCloseAllPopovers(){
    document.querySelectorAll(".xl-popover").forEach(function(p){ p.remove(); });
    document.querySelectorAll(".xl-filter-btn.active").forEach(function(b){ b.classList.remove("active"); });
    xlOpenKey = null;
  }
  document.addEventListener("click", function(){ xlCloseAllPopovers(); });

  function xlApplyState(table, key, skipCols){
    var state = xlGetState(key);
    var tbody = table.querySelector("tbody");
    if (!tbody) return;
    var rows = Array.from(tbody.querySelectorAll("tr"));

    // Filtro: uma linha some se, pra QUALQUER coluna com filtro ativo, o
    // valor dela não estiver marcado.
    rows.forEach(function(tr){
      var tds = Array.from(tr.children);
      var visible = true;
      Object.keys(state.filters).forEach(function(colIdxStr){
        if (!visible) return;
        var colIdx = parseInt(colIdxStr, 10);
        var allowed = state.filters[colIdx];
        if (!allowed) return; // sem filtro nessa coluna
        var v = xlCellValue(tds[colIdx]);
        if (!allowed.has(v)) visible = false;
      });
      tr.style.display = visible ? "" : "none";
    });

    // Ordenação: reordena os <tr> dentro do tbody (mantém os elementos vivos,
    // então inputs/listeners continuam funcionando).
    if (state.sort){
      var colIdx = state.sort.col, dir = state.sort.dir;
      var sorted = rows.slice().sort(function(a, b){
        var va = xlCellValue(a.children[colIdx]), vb = xlCellValue(b.children[colIdx]);
        var na = parseFloat(String(va).replace(",", ".")), nb = parseFloat(String(vb).replace(",", "."));
        var cmp;
        if (!isNaN(na) && !isNaN(nb) && String(va).trim() !== "" && String(vb).trim() !== "") cmp = na - nb;
        else cmp = va.localeCompare(vb, "pt-BR", {sensitivity:"base", numeric:true});
        return dir === "desc" ? -cmp : cmp;
      });
      sorted.forEach(function(tr){ tbody.appendChild(tr); });
    }

    // Indicador visual (funil colorido) nas colunas com filtro ativo.
    table.querySelectorAll(".xl-filter-btn").forEach(function(btn){
      var colIdx = parseInt(btn.dataset.col, 10);
      btn.classList.toggle("filtered", !!state.filters[colIdx]);
    });
  }

  function xlOpenPopover(table, colIdx, key, btn){
    xlCloseAllPopovers();
    xlOpenKey = key;
    btn.classList.add("active");
    var state = xlGetState(key);
    var tbody = table.querySelector("tbody");
    var rows = Array.from(tbody.querySelectorAll("tr"));

    // Valores únicos da coluna, olhando TODAS as linhas (independente do
    // filtro atual dessa mesma coluna — assim dá pra reabrir e trocar).
    var counts = {};
    rows.forEach(function(tr){
      var v = xlCellValue(tr.children[colIdx]);
      if (v === "") v = "(vazio)";
      counts[v] = (counts[v] || 0) + 1;
    });
    var values = Object.keys(counts).sort(function(a,b){ return a.localeCompare(b, "pt-BR", {sensitivity:"base", numeric:true}); });
    var allowed = state.filters[colIdx]; // undefined = tudo marcado

    var pop = document.createElement("div");
    pop.className = "xl-popover";
    pop.innerHTML =
      '<div class="xl-pop-sort">' +
        '<button type="button" data-sort="asc">⬆ Classificar A→Z</button>' +
        '<button type="button" data-sort="desc">⬇ Classificar Z→A</button>' +
      '</div>' +
      '<input type="text" class="xl-pop-search" placeholder="Buscar valor..."/>' +
      '<label class="xl-pop-all"><input type="checkbox" class="xl-pop-all-cb" '+(!allowed?"checked":"")+'/> (Selecionar tudo)</label>' +
      '<div class="xl-pop-list"></div>' +
      '<div class="xl-pop-foot">' +
        '<button type="button" class="btn-ghost xl-pop-clear" style="padding:5px 8px;">Limpar filtro</button>' +
        '<button type="button" class="btn-primary xl-pop-ok" style="padding:6px 12px;">OK</button>' +
      '</div>';

    var listEl = pop.querySelector(".xl-pop-list");
    function paintList(filterTxt){
      var txt = (filterTxt || "").toLowerCase();
      listEl.innerHTML = values.filter(function(v){ return v.toLowerCase().indexOf(txt) !== -1; }).map(function(v){
        var checked = !allowed || allowed.has(v);
        return '<label class="xl-pop-item"><input type="checkbox" value="'+esc(v)+'" '+(checked?"checked":"")+'/> '+esc(v)+' <span class="xl-pop-count">('+counts[v]+')</span></label>';
      }).join("") || '<div class="xl-pop-empty">Nenhum valor encontrado.</div>';
    }
    paintList("");

    pop.querySelector(".xl-pop-search").addEventListener("input", function(e){ paintList(e.target.value); });
    pop.querySelector(".xl-pop-search").addEventListener("click", function(e){ e.stopPropagation(); });
    pop.querySelector(".xl-pop-all-cb").addEventListener("change", function(e){
      listEl.querySelectorAll("input[type=checkbox]").forEach(function(cb){ cb.checked = e.target.checked; });
    });
    pop.addEventListener("click", function(e){ e.stopPropagation(); });
    pop.querySelectorAll("[data-sort]").forEach(function(b){
      b.addEventListener("click", function(){
        state.sort = {col:colIdx, dir:b.dataset.sort};
        xlApplyState(table, key);
        xlCloseAllPopovers();
      });
    });
    pop.querySelector(".xl-pop-clear").addEventListener("click", function(){
      delete state.filters[colIdx];
      xlApplyState(table, key);
      xlCloseAllPopovers();
    });
    pop.querySelector(".xl-pop-ok").addEventListener("click", function(){
      var checked = Array.from(listEl.querySelectorAll("input[type=checkbox]:checked")).map(function(cb){ return cb.value; });
      if (checked.length === values.length) delete state.filters[colIdx];
      else state.filters[colIdx] = new Set(checked);
      xlApplyState(table, key);
      xlCloseAllPopovers();
    });

    document.body.appendChild(pop);
    var r = btn.getBoundingClientRect();
    var top = r.bottom + window.scrollY + 4;
    var left = Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 260);
    pop.style.top = top + "px";
    pop.style.left = left + "px";
  }

  // Monta os botões de filtro no <thead> de uma tabela dentro de containerEl
  // e reaplica o filtro/ordenação guardados pra essa key. Chamar sempre
  // depois de montar o innerHTML da tabela (o cabeçalho é recriado do zero
  // a cada pintura, então os botões precisam ser remontados também).
  function xlEnhance(containerEl, key, skipCols){
    var table = containerEl && containerEl.querySelector ? containerEl.querySelector("table") : null;
    if (!table) return;
    skipCols = skipCols || [];
    var ths = Array.from(table.querySelectorAll("thead th"));
    ths.forEach(function(th, colIdx){
      if (skipCols.indexOf(colIdx) !== -1) return;
      var label = th.textContent.replace(/▾/g,"").trim();
      th.innerHTML = '<span class="xl-th-label">'+esc(label)+'</span><button type="button" class="xl-filter-btn" data-col="'+colIdx+'" title="Filtrar/ordenar">▾</button>';
      th.querySelector(".xl-filter-btn").addEventListener("click", function(e){

  /* ---------------- Date helpers ---------------- */
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function toISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function fromISO(s){ var p = s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function brDate(s){ s = String(s == null ? "" : s); var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + "/" + m[2] + "/" + m[1] : s; }
  function fmtBR(d){ return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear(); }
  function weekdayLong(d){ return d.toLocaleDateString("pt-BR", {weekday:"long"}); }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function isSunday(d){ return d.getDay() === 0; }
  // Datas que chegam de importação (EFIT/SEFAZ, PUZL) podem vir em formatos
  // bem diferentes — "2026-09-22" (ISO, já no padrão interno), "22/09/2026"
  // (BR, o mais comum ao copiar do Excel com célula formatada como data) ou
  // até o número de série do Excel como texto puro (célula sem formatação
  // de data aplicada, ex: "46283") — normaliza tudo pra ISO (YYYY-MM-DD),
  // que é o formato usado internamente (matchProgramacao, o filtro de
  // Período de Controle de Pedidos etc.). Sem isso, uma nota importada com
  // data em formato diferente do ISO nunca aparece em nenhum filtro por
  // período nem cruza com a Programação, mesmo estando "lá dentro".
  function normalizeDateToISO(s){
    s = String(s == null ? "" : s).trim();
    if (!s) return "";
    var mIso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (mIso) return mIso[1] + "-" + pad2(parseInt(mIso[2], 10)) + "-" + pad2(parseInt(mIso[3], 10));
    var mBr = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (mBr) return mBr[3] + "-" + pad2(parseInt(mBr[2], 10)) + "-" + pad2(parseInt(mBr[1], 10));
    if (/^\d+(\.\d+)?$/.test(s)){
      var serial = parseFloat(s);
      if (serial > 20000 && serial < 60000){ // faixa plausível de datas (~1954–2064)
        var ms = Date.UTC(1899, 11, 30) + Math.round(serial) * 86400000;
        var d = new Date(ms);
        return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth()+1) + "-" + pad2(d.getUTCDate());
      }
    }
    return s; // formato não reconhecido: mantém como veio, em vez de descartar
  }
  function sameDay(a,b){ return toISO(a) === toISO(b); }

  var TODAY = (function(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();

  /* Seletor de período reutilizável (usado na Programação de Cimento e no VPO).
     ids = {btn, panel, label}; onApply(state) é chamado sempre que o período muda. */
  function makeRangePicker(ids, onApply){
    var state = { rangeStart: new Date(TODAY), rangeEnd: new Date(TODAY), pendingStart: null, calViewMonth: new Date(TODAY.getFullYear(), TODAY.getMonth(), 1) };

    function setQuickRange(offsetDays){
      var d = addDays(TODAY, offsetDays);
      state.rangeStart = d; state.rangeEnd = d; state.pendingStart = null;
      state.calViewMonth = new Date(d.getFullYear(), d.getMonth(), 1);
      // Só marca a seleção e repinta — não aplica nem fecha sozinho: o
      // painel só fecha ao clicar em "Aplicar" ou fora dele (ver mais abaixo).
      paintCalendar();
    }

    function paintCalendar(){
      var quick = [["Ontem",-1],["Hoje",0],["Amanhã",1]];
      var quickHtml = '<div class="dr-quick">' + quick.map(function(q){
        var d = addDays(TODAY, q[1]);
        var isActive = sameDay(state.rangeStart,d) && sameDay(state.rangeEnd,d);
        return '<button data-off="'+q[1]+'" class="'+(isActive?"active":"")+'">'+q[0]+'</button>';
      }).join("") + '</div>';

      var monthLabel = state.calViewMonth.toLocaleDateString("pt-BR", {month:"long", year:"numeric"});
      var head = '<div class="dr-cal-head"><button class="calPrev">‹</button><span>'+esc(monthLabel)+'</span><button class="calNext">›</button></div>';

      var dows = ["D","S","T","Q","Q","S","S"];
      var dowRow = '<div class="dr-grid">' + dows.map(function(w,i){ return '<div class="dow'+(i===0?" sun":"")+'">'+w+'</div>'; }).join("") + '</div>';

      var first = new Date(state.calViewMonth.getFullYear(), state.calViewMonth.getMonth(), 1);
      var startOffset = first.getDay();
      var gridStart = addDays(first, -startOffset);
      var cells = "";
      for (var i=0; i<42; i++){
        var d = addDays(gridStart, i);
        var inMonth = d.getMonth() === state.calViewMonth.getMonth();
        var cls = "dr-day" + (isSunday(d) ? " sun" : "") + (inMonth ? "" : " muted");
        var lo = state.rangeStart < state.rangeEnd ? state.rangeStart : state.rangeEnd;
        var hi = state.rangeStart < state.rangeEnd ? state.rangeEnd : state.rangeStart;
        if (!state.pendingStart && sameDay(state.rangeStart, state.rangeEnd) && sameDay(d, state.rangeStart)) cls += " single";
        else if (!state.pendingStart && d >= lo && d <= hi){
          if (sameDay(d, lo)) cls += " range-start in-range";
          else if (sameDay(d, hi)) cls += " range-end in-range";
          else cls += " in-range";
        } else if (state.pendingStart && sameDay(d, state.pendingStart)) cls += " single";
        cells += '<button class="'+cls+'" data-iso="'+toISO(d)+'">'+d.getDate()+'</button>';
      }
      var grid = '<div class="dr-grid">' + cells + '</div>';

      var hint = state.pendingStart
        ? 'Início: <b>'+esc(fmtBR(state.pendingStart))+'</b> — agora clique no dia final (pode ser quantos dias quiser).'
        : 'Clique no dia inicial e depois no dia final para selecionar quantos dias quiser.';
      el(ids.panel).innerHTML = quickHtml + '<p class="dr-hint">'+hint+'</p>' + head + dowRow + grid +
        '<button class="btn-primary dr-apply">Aplicar</button>';

      el(ids.panel).querySelectorAll(".dr-quick button").forEach(function(b){
        b.addEventListener("click", function(){ setQuickRange(parseInt(b.dataset.off,10)); });
      });
      el(ids.panel).querySelector(".calPrev").addEventListener("click", function(){ state.calViewMonth = addDays(state.calViewMonth, -1); state.calViewMonth.setDate(1); paintCalendar(); });
      el(ids.panel).querySelector(".calNext").addEventListener("click", function(){ state.calViewMonth = new Date(state.calViewMonth.getFullYear(), state.calViewMonth.getMonth()+1, 1); paintCalendar(); });
      el(ids.panel).querySelectorAll(".dr-day[data-iso]").forEach(function(b){
        b.addEventListener("click", function(){
          var d = fromISO(b.dataset.iso);
          if (!state.pendingStart){
            state.pendingStart = d;
            paintCalendar();
          } else {
            if (d < state.pendingStart){ state.rangeStart = d; state.rangeEnd = state.pendingStart; }
            else { state.rangeStart = state.pendingStart; state.rangeEnd = d; }
            state.pendingStart = null;
            // Só marca o intervalo e repinta o calendário — o painel continua
            // aberto pra escolher quantas datas quiser (pode clicar de novo
            // pra recomeçar a seleção); só aplica de fato (e fecha) ao clicar
            // em "Aplicar" ou ao clicar fora do painel.
            paintCalendar();
          }
        });
      });
      el(ids.panel).querySelector(".dr-apply").addEventListener("click", function(){
        if (state.pendingStart){ state.rangeStart = state.pendingStart; state.rangeEnd = state.pendingStart; state.pendingStart = null; }
        el(ids.panel).classList.remove("open");
        onApply();
      });
    }

    el(ids.btn).addEventListener("click", function(){
      el(ids.panel).classList.toggle("open");
      paintCalendar();
    });
    // Fecha o painel ao clicar fora dele. IMPORTANTE: usar composedPath() em
    // vez de el(ids.panel).contains(ev.target) — um clique num dia (ou nos
    // atalhos "Ontem/Hoje/Amanhã") repinta o calendário (paintCalendar) NA
    // HORA, o que troca o conteúdo do painel e desconecta o elemento que
    // recebeu o clique da árvore atual; contains(ev.target) então dava falso
    // mesmo pra um clique dentro do próprio painel, fechando ele sozinho a
    // cada clique (era preciso reabrir toda vez). composedPath() guarda o
    // caminho do clique como ele era no momento do clique, antes de qualquer
    // repintura, então continua reconhecendo corretamente cliques dentro do
    // painel mesmo depois dele ser recriado.
    document.addEventListener("click", function(ev){
      var path = ev.composedPath ? ev.composedPath() : [ev.target];
      if (path.indexOf(el(ids.panel)) === -1 && path.indexOf(el(ids.btn)) === -1) {
        // Clicar fora também aplica o que já foi selecionado até então (igual
        // clicar em "Aplicar") — sem isso, escolher as datas e clicar fora
        // pra fechar perderia a seleção em vez de confirmá-la.
        if (el(ids.panel).classList.contains("open")){
          if (state.pendingStart){ state.rangeStart = state.pendingStart; state.rangeEnd = state.pendingStart; state.pendingStart = null; }
          el(ids.panel).classList.remove("open");
          onApply();
        }
      }
    });

    return {
      state: state,
      updateLabel: function(){
        el(ids.label).textContent = sameDay(state.rangeStart, state.rangeEnd) ? fmtBR(state.rangeStart) : fmtBR(state.rangeStart) + " → " + fmtBR(state.rangeEnd);
      }
    };
  }

  function rangeDays(state){
    var lo = state.rangeStart < state.rangeEnd ? state.rangeStart : state.rangeEnd;
    var hi = state.rangeStart < state.rangeEnd ? state.rangeEnd : state.rangeStart;
    var days = [];
    for (var d = new Date(lo); d <= hi; d = addDays(d, 1)) days.push(new Date(d));
    return days;
  }

  function paintBlocks(){
    progPicker.updateLabel();
    var days = rangeDays(progPicker.state);

    var shown = 0;
    var agg = { programadas:0, ok:0, conferir:0, pendentes:0 };
    var html = days.map(function(day){
      var iso = toISO(day);
      var data = cementDayData(iso);
      var sunday = isSunday(day);
      if (sunday && !data.isException) return ""; // domingo sem exceção: não mostra bloco
      shown++;

      // Monta as linhas: para dias normais, SEMPRE repete a lista completa de
      // usinas (preenchida onde já há dado, em branco onde não há) — igual à
      // planilha original. Para o domingo de exceção, mostra só o que existe.
      var byKey = {};
      data.entries.forEach(function(e){ byKey[entryKey(e)] = e; });
      var entries;
      if (sunday) {
        entries = data.entries.slice();
      } else {
        entries = MASTER_USINAS.map(function(u){ return byKey[u] || {usina:u, carretas:"", fabrica:"", pedido:"", obs:""}; });
        data.entries.forEach(function(e){ if (MASTER_USINAS.indexOf(e.usina) === -1) entries.push(e); });
      }

      var refText = data.ref || fmtBR(addDays(day,-1)) + " (" + weekdayLong(addDays(day,-1)) + ")";
      var rows = entries.map(function(e){
        var key = entryKey(e);
        if (String(e.carretas||"").trim()){
          agg.programadas++;
          if (e.status === "ok") agg.ok++;
          else if (e.status === "conferir") agg.conferir++;
          else agg.pendentes++;
        }
        var statusClass = e.status === "ok" ? "usina-ok" : (e.status === "conferir" ? "usina-conferir" : "");
        var usinaCell = MASTER_USINAS.indexOf(e.usina) !== -1
          ? '<td class="cell-strong '+statusClass+'" style="white-space:nowrap;">'+esc(e.usina)+'</td>'
          : progInput(iso, key, "usina", e.usina, "Nome da usina", statusClass);
        var statusSelect = '<td style="padding:4px 6px;"><select data-iso="'+iso+'" data-key="'+esc(key)+'" data-field="status" class="status-select">' +
          '<option value=""'+(!e.status?" selected":"")+'>—</option>' +
          '<option value="ok"'+(e.status==="ok"?" selected":"")+'>Tudo OK</option>' +
          '<option value="conferir"'+(e.status==="conferir"?" selected":"")+'>Conferir</option>' +
          '</select></td>';
        // NF (SEFAZ): traz a conferência de Controle de Pedidos até aqui —
        // se alguma entrada que já bate com essa linha da programação tiver
        // uma nota confirmada no SEFAZ, mostra "Descarregada"; se tiver
        // documento lançado mas ainda sem confirmação no SEFAZ, "Emitida".
        var nfSt = progEntryNFStatus(e);
        var nfCanc = nfCanceladasLigadas(e).map(function(nf){ return '<span class="badge danger" title="Esta nota está CANCELADA no SEFAZ">🚫 NF '+esc(nf.numero)+' CANCELADA</span>'; }).join(" ");
        var nfCell = '<td style="padding:4px 6px;">' + nfCanc + (
          nfSt === "cancelada" ? '<span class="badge danger">🚫 NF CANCELADA</span>' :
          nfSt === "confirmada" ? '<span class="badge success">✅ Descarregada</span>' :
          nfSt === "emitida" ? '<span class="badge warning">Emitida</span>' :
          '<span class="faint" style="font-style:italic;font-size:11px;">—</span>'
        ) + '</td>';
        return '<tr>' + usinaCell +
          progMultiInput(iso, key, "carretas", e.carretas) +
          progMultiFabricaSelect(iso, key, e.fabrica) +
          progMultiInput(iso, key, "pedido", e.pedido) +
          progInput(iso, key, "obs", e.obs, "ex: OK, CEDO, TARDE") +
          nfCell +
          statusSelect + '</tr>';
      }).join("");
      return '<div class="prog-block'+(data.isException?" exception":"")+'" data-iso="'+iso+'">' +
        '<div class="prog-block-head"><div class="ref">'+esc(refText)+'</div><div class="title">PROGRAMAÇÃO PARA O DIA '+esc(fmtBR(day).toUpperCase())+' ('+esc(weekdayLong(day).toUpperCase())+')'+(data.isException?' · EXCEÇÃO':'')+'</div></div>' +
        (entries.length
          ? '<div class="table-wrap"><table><thead><tr><th>Usina</th><th>Carretas</th><th>Fábrica</th><th>Número do Pedido</th><th>Observação</th><th>NF (SEFAZ)</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
          : '<p class="prog-empty">Nenhuma usina registrada para este dia.</p>') +
        '<div class="prog-add" data-iso="'+iso+'">+ adicionar usina</div>' +
        '</div>';
    }).join("");

    el("dayInfo").textContent = shown + " dia(s) exibido(s) de " + days.length + " selecionado(s)" + (days.length > shown ? " · domingo(s) sem carga ocultado(s) automaticamente" : "");
    el("progBlocks").innerHTML = html || '<div class="notice"><h3>Nenhum dia para exibir</h3><p>O período selecionado só contém domingos sem carga programada.</p></div>';

    el("progStats").innerHTML = '<div class="stat-grid">' +
      '<div class="stat" style="--stat-accent:var(--info);"><div class="stat-top"><span>Dias no período</span><span class="stat-icn" style="background:var(--info-soft);color:var(--info);">📅</span></div><div class="stat-val">'+shown+'</div><div class="stat-sub">de '+days.length+' selecionado(s)</div></div>' +
      '<div class="stat" style="--stat-accent:var(--neutral);"><div class="stat-top"><span>Usinas programadas</span><span class="stat-icn" style="background:var(--neutral-soft);color:var(--neutral);">🚛</span></div><div class="stat-val">'+agg.programadas+'</div></div>' +
      '<div class="stat" style="--stat-accent:var(--success);"><div class="stat-top"><span>Tudo OK</span><span class="stat-icn" style="background:var(--success-soft);color:var(--success);">✅</span></div><div class="stat-val">'+agg.ok+'</div></div>' +
      '<div class="stat" style="--stat-accent:var(--warning);"><div class="stat-top"><span>A conferir</span><span class="stat-icn" style="background:var(--warning-soft);color:var(--warning);">⏳</span></div><div class="stat-val">'+agg.conferir+'</div></div>' +
      '<div class="stat" style="--stat-accent:var(--border-strong);"><div class="stat-top"><span>Sem status</span><span class="stat-icn" style="background:var(--neutral-soft);color:var(--text-faint);">—</span></div><div class="stat-val">'+agg.pendentes+'</div></div>' +
      '</div>';

    el("progBlocks").querySelectorAll("input[data-iso]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var entry = getOrCreateEntry(inp.dataset.iso, inp.dataset.key);
        entry[inp.dataset.field] = inp.value;
      });
    });
    el("progBlocks").querySelectorAll(".multi-field").forEach(wireMultiField);
    el("progBlocks").querySelectorAll("select.status-select").forEach(function(sel){
      sel.addEventListener("change", function(){
        var entry = getOrCreateEntry(sel.dataset.iso, sel.dataset.key);
        entry.status = sel.value;
        var usinaTd = sel.closest("tr").querySelector("td:first-child");
        usinaTd.classList.remove("usina-ok", "usina-conferir");
        if (sel.value === "ok") usinaTd.classList.add("usina-ok");
        else if (sel.value === "conferir") usinaTd.classList.add("usina-conferir");
      });

    el("progBlocks").querySelectorAll(".prog-add").forEach(function(btn){
      btn.addEventListener("click", function(){
        var iso = btn.dataset.iso;
        if (!cementScheduleByDate[iso]) cementScheduleByDate[iso] = { ref:"", isException:isSunday(fromISO(iso)), entries:[] };
        cementScheduleByDate[iso].entries.push({usina:"", carretas:"", fabrica:"", pedido:"", obs:"", __key:"extra-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)});
        paintBlocks();

  // Identificador estável por linha: nome da usina para linhas da lista mestre
  // (nunca muda), ou uma chave gerada para linhas adicionadas manualmente.
  function entryKey(e){ return e.usina && MASTER_USINAS.indexOf(e.usina) !== -1 ? e.usina : (e.__key || (e.__key = "extra-"+Date.now()+"-"+Math.random().toString(36).slice(2,7))); }

  function getOrCreateEntry(iso, key){
    if (!cementScheduleByDate[iso]) cementScheduleByDate[iso] = { ref:"", isException:isSunday(fromISO(iso)), entries: [] };
    var day = cementScheduleByDate[iso];
    var found = day.entries.find(function(e){ return entryKey(e) === key; });
    if (!found){
      found = MASTER_USINAS.indexOf(key) !== -1
        ? { usina:key, carretas:"", fabrica:"", pedido:"", obs:"" }
        : { usina:"", carretas:"", fabrica:"", pedido:"", obs:"", __key:key };
      day.entries.push(found);
    }
    return found;
  }

  function progInput(iso, key, field, value, placeholder, tdClass){
    return '<td class="'+(tdClass||"")+'" style="padding:4px 6px;"><input value="'+esc(value)+'" placeholder="'+esc(placeholder||"")+'" data-iso="'+iso+'" data-key="'+esc(key)+'" data-field="'+field+'" ' +
      'style="width:100%;border:1px solid transparent;border-radius:5px;padding:6px 8px;font-size:12.5px;background:transparent;color:var(--text);" ' +
      'onfocus="this.style.borderColor=\'var(--accent)\'" onblur="this.style.borderColor=\'transparent\'"/></td>';
  }

  // Campos que podem ter até 3 valores na mesma coluna (ex: até 3 placas, 3
  // fábricas ou 3 pedidos por linha da Programação) — continuam guardados
  // como uma única string separada por "/" (mesmo formato que já era aceito
  // digitando "A / B / C" à mão, e que fabricaListFrom/pedidoListFrom já
  // sabem interpretar), só que agora com um "+" pra abrir mais um campo em
  // vez de digitar a barra manualmente. O layout da tabela não muda — cada
  // célula continua sendo uma célula só, só que pode crescer pra até 3
  // linhas de input dentro dela.
  function multiListFrom(str){
    return String(str||"").split("/").map(function(s){ return s.trim(); }).filter(function(s){ return s && s !== "—"; });
  }
  function multiJoin(vals){
    return vals.map(function(s){ return String(s||"").trim(); }).filter(Boolean).join(" / ");
  }
  var MULTI_INPUT_STYLE = 'flex:1;min-width:0;border:1px solid transparent;border-radius:5px;padding:6px 8px;font-size:12.5px;background:transparent;color:var(--text);';
  function progMultiInput(iso, key, field, value, placeholder, tdClass, max){
    max = max || 3;
    var vals = multiListFrom(value);
    if (!vals.length) vals = [""];
    if (vals.length > max) vals = vals.slice(0, max);
    var rows = vals.map(function(v, idx){
      var isLast = idx === vals.length - 1;
      var addBtn = (isLast && vals.length < max) ? '<button type="button" class="multi-add-btn" title="Adicionar mais um">+</button>' : "";
      var removeBtn = '<button type="button" class="multi-remove-btn" title="Apagar">×</button>';
      return '<div class="multi-row"><input value="'+esc(v)+'" placeholder="'+esc(placeholder||"")+'" style="'+MULTI_INPUT_STYLE+'" ' +
        'onfocus="this.style.borderColor=\'var(--accent)\'" onblur="this.style.borderColor=\'transparent\'"/>' + addBtn + removeBtn + '</div>';
    }).join("");
    return '<td class="'+(tdClass||"")+'" style="padding:4px 6px;"><div class="multi-field" data-iso="'+iso+'" data-key="'+esc(key)+'" data-field="'+field+'" data-max="'+max+'" data-placeholder="'+esc(placeholder||"")+'">' + rows + '</div></td>';
  }
  var MULTI_SELECT_STYLE = 'flex:1;min-width:0;height:30px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:11.5px;padding:0 6px;';
  // Campo Fábrica: até 3 seleções de "Fornecedor — Material", vindas da Base
  // de Fábricas (FABRICAS_CATALOGO) — substitui o texto livre de antes (ex:
  // "CP3", "CSN") por uma escolha controlada, igual ao espírito do Usina
  // 1/Usina 2 do VPO (escolhe da lista, agrupado por fornecedor), só que sem
  // usina/localização aqui, porque a usina já é a linha da tabela.
  function progMultiFabricaSelect(iso, key, value, max){
    max = max || 3;
    var vals = multiListFrom(value);
    if (!vals.length) vals = [""];
    if (vals.length > max) vals = vals.slice(0, max);
    var rows = vals.map(function(v, idx){
      var isLast = idx === vals.length - 1;
      var addBtn = (isLast && vals.length < max) ? '<button type="button" class="multi-add-btn" title="Adicionar mais um">+</button>' : "";
      var removeBtn = '<button type="button" class="multi-remove-btn" title="Apagar">×</button>';
      return '<div class="multi-row"><select class="multi-select-control" style="'+MULTI_SELECT_STYLE+'">' + fabricaSelectOptionsHtml(v) + '</select>' + addBtn + removeBtn + '</div>';
    }).join("");
    return '<td style="padding:4px 6px;"><div class="multi-field" data-iso="'+iso+'" data-key="'+esc(key)+'" data-field="fabrica" data-max="'+max+'">' + rows + '</div></td>';
  }
  // Delegação de eventos por container (funciona mesmo pra linhas adicionadas
  // depois pelo "+", sem precisar reamarrar nada): qualquer "change" num
  // campo (input OU select) dentro do .multi-field re-junta os valores das
  // até 3 linhas e salva no campo; o clique no "+" clona o último campo (pra
  // funcionar tanto com input livre quanto com select — não precisa saber
  // qual é) em branco, até o máximo, e some quando chega no limite.
  function wireMultiField(container){
    container.addEventListener("change", function(e){
      if (!e.target.matches("input, select")) return;
      syncMultiField(container);
    });
    container.addEventListener("click", function(e){
      var addBtn = e.target.closest(".multi-add-btn");
      if (addBtn){
        e.preventDefault();
        var max = parseInt(container.dataset.max, 10) || 3;
        var rows = container.querySelectorAll(".multi-row");
        if (rows.length >= max) return;
        var lastControl = rows[rows.length - 1].querySelector("input, select");
        var novo = lastControl.cloneNode(true);
        if (novo.tagName === "SELECT") { Array.prototype.slice.call(novo.querySelectorAll("option")).forEach(function(o){ if (/não reconhecido/.test(o.textContent)) o.remove(); }); novo.value = ""; } else novo.value = "";
        addBtn.remove();
        var div = document.createElement("div");
        div.className = "multi-row";
        div.appendChild(novo);
        if (rows.length + 1 < max){
          var newBtn = document.createElement("button");
          newBtn.type = "button"; newBtn.className = "multi-add-btn"; newBtn.title = "Adicionar mais um"; newBtn.textContent = "+";
          div.appendChild(newBtn);
        }
        var removeBtn = document.createElement("button");
        removeBtn.type = "button"; removeBtn.className = "multi-remove-btn"; removeBtn.title = "Apagar"; removeBtn.textContent = "×";
        div.appendChild(removeBtn);
        container.appendChild(div);
        novo.focus();
        syncMultiField(container);
        return;
      }
      var removeBtn2 = e.target.closest(".multi-remove-btn");
      if (!removeBtn2) return;
      e.preventDefault();
      var row = removeBtn2.closest(".multi-row");
      var allRows = container.querySelectorAll(".multi-row");
      if (allRows.length > 1){
        row.remove();
        var remaining = container.querySelectorAll(".multi-row");
        var last = remaining[remaining.length - 1];
        if (last && !last.querySelector(".multi-add-btn")){
          var max2 = parseInt(container.dataset.max, 10) || 3;
          if (remaining.length < max2){
            var newAddBtn = document.createElement("button");
            newAddBtn.type = "button"; newAddBtn.className = "multi-add-btn"; newAddBtn.title = "Adicionar mais um"; newAddBtn.textContent = "+";
            var lastRemoveBtn = last.querySelector(".multi-remove-btn");
            last.insertBefore(newAddBtn, lastRemoveBtn);
          }
        }
      } else {
        var control = row.querySelector("input, select");
        if (control.tagName === "SELECT") { control.value = ""; } else control.value = "";
      }
      syncMultiField(container);
    });
  }
  function syncMultiField(container){
    var entry = getOrCreateEntry(container.dataset.iso, container.dataset.key);
    var vals = Array.prototype.map.call(container.querySelectorAll("input, select"), function(el){ return el.value; });
    entry[container.dataset.field] = multiJoin(vals);
  }

  /* ---------------- Base de Dados — importação por módulo ---------------- */
  // Módulos ativos: Entradas (NF) — já funcional, alimenta o Controle de
  // Pedidos —, Notas Fiscais (SEFAZ) — a exportação de notas EMITIDAS pelos
  // fornecedores, usada pra confirmar se uma entrada já lançada realmente
  // descarregou (ver comentário mais abaixo) — e Lançamentos, que fica
  // reservado pra quando definirmos a estrutura (ex: PUZL/estoque). Os demais
  // módulos do modelo de referência (Saídas, SAP, Custos SAP) não se aplicam
  // à Concrelagos por enquanto e não entram aqui.
  var importHistorico = [];
  var histSeq = 0;
  function fmtDataHora(d){
    return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear()+", "+pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds());
  }
  function logImport(arquivo, modulo, added, total){
    importHistorico.unshift({
      id: ++histSeq, arquivo: arquivo, modulo: modulo, registros: added, total: total,
      dataHora: fmtDataHora(new Date()), status: "Salvo"
    });
    if (typeof persistImport === "function") persistImport(importHistorico[0]);
  }

  // ---- Notas Fiscais (SEFAZ) ----
  // A exportação do SEFAZ mostra as notas EMITIDAS pelos fornecedores
  // (Número, Emissão, Nome, Material, Descrição Complementar etc.). A
  // conferência de "já descarregou" usa a regra que você deu: pega o
  // "Número" da nota e confere se ele aparece como "Documento/NF" em alguma
  // entrada já lançada (Base de Dados > Entradas).
  //
  // A ligação com a Programação de Cimento usa Pedido (1º critério) e,
  // faltando ele, Usina + Placa + Data (2º critério, combinado em 22/09).
  // "Usina" aqui é SEMPRE a usina de DESCARGA (destino da carga) — nunca o
  // município/UF do emitente da nota, que é só onde fica a fábrica do
  // fornecedor e não diz nada sobre pra onde a carga foi.
  //
  // Analisando o arquivo real que você mandou (reportIbound_13.xlsx, 1795
  // notas, só 169 de cimento) — a "Descrição Complementar" TEM um padrão,
  // só que um padrão por fornecedor, não um único pra todos:
  //  - CSN: não traz pedido nem placa, mas traz "CLIENTE: <código>" — que é
  //    exatamente o código de cliente por usina já cadastrado em Códigos por
  //    Fornecedor. Dá pra achar a usina por aí.
  //  - Cimento Tupi: "Pedido nro <nº>" e "VEICULO PLACAS: <placa> - ...".
  //  - Intercement: "Nº do Pedido : <nº>", "Dados da Placa: <placa>" e
  //    "End. Entrega : <endereço>" — o endereço geralmente cita o nome da
  //    cidade/usina, então dá pra bater contra a lista de usinas.
  //  - Cimento Campeão Alvorada (CCA) / Nacional de Cimento (CNC): "Numero
  //    OVs <nº>" (a "OV" faz o papel de pedido aqui).
  //  - Cimentos Liz: "Ordem Vda <nº>" e "Placa Reboque Semi Reboque <placa>".
  //  - Fábrica interna (ex: "ITABIRA - FABRICA") e notas entre filiais da
  //    própria Concrelagos: sem pedido identificável — só dá pra tentar a
  //    placa (via "CAVALO-CARRETAS: ..."), então essas tendem a cair pra
  //    conferência manual mesmo.
  // Por isso, em vez de digitar tudo à mão, a importação abaixo tenta essa
  // extração automática por fornecedor quando você cola a Descrição
  // Complementar junto — e você sempre pode corrigir manualmente depois.
  //
  // Além das regras por fornecedor, existe uma camada extra e independente
  // de fornecedor: a Base de Usinas (usinasCadastro, cadastrada em Base de
  // Dados a partir do cadastro oficial de filiais) guarda Usina + CNPJ. Se o
  // texto da nota trouxer um CNPJ que bate com essa base, a usina é
  // reconhecida por aí — mais confiável que "achar nome de cidade no
  // endereço". Hoje, olhando o arquivo real que você mandou, só a
  // Intercement inclui esse CNPJ no texto (as outras não trazem nenhum CNPJ
  // nosso na Descrição Complementar) — mas a camada é genérica: qualquer
  // fornecedor futuro cuja nota inclua um CNPJ cadastrado passa a se
  // beneficiar automaticamente, sem precisar de uma regra nova.
  //
  // Também: nem toda nota do SEFAZ é cimento (a maioria do arquivo real era
  // areia, brita, diesel etc.). Por isso a importação já filtra pelo
  // Catálogo de Cimentos abaixo — só o que bate com um termo cadastrado ali
  // entra no sistema; o resto é ignorado (nunca "importado pra depois
  // apagar"). O catálogo é editável em Base de Dados, pra quando surgir um
  // tipo de cimento novo.
  // "POZOLANA" foi adicionada depois de cruzar com a PUZL (RESUMO_DE_ENTRADAS):
  // o texto do SEFAZ pra pozolana nem sempre é óbvio, mas na PUZL o item
  // aparece claro como "POZOLANA"/"POZOLANA PLX" — ver puzlMatchParaNF abaixo,
  // que também é consultado na importação como um 2º critério pra decidir se
  // uma nota é cimento, quando o texto puro do SEFAZ não bate com nada aqui.
  var CEMENTO_CATALOGO = ["CIMENTO", "CP I", "CP II", "CP III", "CP IV", "CP V", "POZOLANA", "ESCORIA MOIDA", "POZOMIX", "ADICAO MINERAL", "BLEND"];
  var CEMENTO_EXCLUIR = ["MANGOTE"];   // exceções: se o material contém um destes termos, NÃO é cimento (mesmo que bata com o catálogo)
  // Remove acentos (á, ã, ç, õ...) sem apagar a letra embaixo deles — usado
  // antes de comparar textos vindos de fontes diferentes (SEFAZ, PUZL,
  // catálogo cadastrado à mão), que nem sempre grafam acento do mesmo jeito
  // (ex: "ITABIRA - FABRICA" no SEFAZ real vs. "Itabira (fábrica própria)"
  // cadastrado aqui). Sem isso, normalizeMaterial cortava a letra acentuada
  // inteira (ex: "fábrica" virava "FBRICA", não "FABRICA") e quebrava o match.
  function stripAccents(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function normalizeMaterial(s){ return stripAccents(String(s||"")).toUpperCase().replace(/[^A-Z0-9]/g, ""); }
  function materialExcluido(material){
    var norm = normalizeMaterial(material);
    if (!norm) return false;
    return CEMENTO_EXCLUIR.some(function(termo){ var t = normalizeMaterial(termo); return t && norm.indexOf(t) !== -1; });
  }
  function materialEhCimento(material){
    var norm = normalizeMaterial(material);
    if (!norm) return false;
    if (materialExcluido(material)) return false;
    return CEMENTO_CATALOGO.some(function(termo){ var t = normalizeMaterial(termo); return t && norm.indexOf(t) !== -1; });
  }
  // Nota cancelada ou transferência entre filiais: entram só pra registro.
  function nfCancelada(nf){ return !!nf && nf.status === "Cancelada"; }
  function nfTransf(nf){ return !!nf && nf.tipo === "transferencia"; }
  function nfSoRegistro(nf){ return nfCancelada(nf) || nfTransf(nf); }

  // Acha, nos códigos cadastrados em "Códigos por Fornecedor", qual usina
  // corresponde a um código de cliente (ex: CSN "CLIENTE: 27858" -> TAQUARA).
  function usinaByCodigoFornecedor(fornecedorId, codigo){
    var s = cementSuppliers.find(function(x){ return x.id === fornecedorId; });
    if (!s || !codigo) return null;
    var found = s.codigos.find(function(pair){ return pair[1] === codigo; });
    return found ? found[0] : null;
  }
  // Tenta achar o nome de uma usina (da lista MASTER_USINAS) dentro de um
  // trecho de texto livre (ex: o endereço de entrega da Intercement).
  function usinaEmTexto(trecho){
    if (!trecho) return null;
    var alvo = stripAccents(trecho).toUpperCase();
    return MASTER_USINAS.find(function(u){ return alvo.indexOf(stripAccents(u).toUpperCase()) !== -1; }) || null;
  }
  // Regras de extração por fornecedor, aprendidas do arquivo real que você
  // mandou. "match" identifica o fornecedor pelo nome como ele aparece na
  // nota do SEFAZ (campo "Nome"); "extract" devolve o que conseguiu achar.
  var SEFAZ_PARSERS = [
    { match:/CSN/i, extract:function(desc){
        var m = /CLIENTE:\s*(\d+)/i.exec(desc);
        var cod = m ? m[1] : null;
        // O pedido da CSN vem logo depois de "ENCOMENDA:" (ex: "ENCOMENDA: 9011287
        // 010 CLIENTE: 27858" — o "010" depois é um código de item, não faz parte
        // do pedido). Na Programação o mesmo número às vezes aparece com zeros à
        // esquerda (ex: "0009011287") — normalizePedidoNum (usado na conferência)
        // já trata isso como o mesmo pedido, então aqui basta pegar os dígitos.
        var p = /ENCOMENDA:\s*(\d+)/i.exec(desc);
        return { pedido: p?p[1]:null, placa:null, usina: cod ? usinaByCodigoFornecedor("csn", cod) : null };
      } },
    { match:/TUPI/i, extract:function(desc){
        var p = /Pedido\s*nro\s*(\d+)/i.exec(desc);
        var v = /VEICULO\s*PLACAS:\s*([A-Z0-9]{6,7})/i.exec(desc);
        return { pedido: p?p[1]:null, placa: v?v[1].toUpperCase():null, usina:null };
      } },
    { match:/INTERCEMENT/i, extract:function(desc){
        var p = /N[ºo]\s*do\s*Pedido\s*:\s*(\d+)/i.exec(desc);
        var v = /Dados\s*da\s*Placa:\s*([A-Z0-9]{6,7})/i.exec(desc);
        var e = /End\.?\s*Entrega\s*:\s*(.*?)(?:CNPJ:|Inscr\.|$)/i.exec(desc);
        return { pedido: p?p[1]:null, placa: v?v[1].toUpperCase():null, usina: e ? usinaEmTexto(e[1]) : null };
      } },
    { match:/ALVORADA|NACIONAL DE CIMENTO/i, extract:function(desc){
        var p = /Numero\s*OVs\s*(\d+)/i.exec(desc);
        return { pedido: p?p[1]:null, placa:null, usina:null };
      } },
    { match:/CIMENTOS?\s*LIZ/i, extract:function(desc){
        var p = /Ordem\s*Vda\s*(\d+)/i.exec(desc);
        var v = /Placa\s*Reboque\s*Semi\s*Reboque\s*([A-Z0-9]{6,7})/i.exec(desc);
        return { pedido: p?p[1]:null, placa: v?v[1].toUpperCase():null, usina:null };
      } },
    // "ITABIRA" cobre as duas razões sociais vistas no arquivo real (SEFAZ_CMENTOS.xlsx)
    // pra esse nome: "ITABIRA - FABRICA" e "ITABIRA AGRO INDUSTRIAL S/A." — ver
    // nota sobre essa possível duplicidade perto de FABRICAS_CATALOGO. Só
    // ~19% das notas (17 de 91, na amostra) trazem "NUMERO DO PEDIDO: 1-234171"
    // (pedido real, com um prefixo "1-" antes do número); o resto só tem
    // motorista/placa, sem pedido — nesses casos o fallback genérico de placa
    // (mais abaixo) já dá conta sozinho, então aqui não repete.
    { match:/ITABIRA/i, extract:function(desc){
        var p = /NUMERO\s*DO\s*PEDIDO:\s*([\w-]+)/i.exec(desc);
        return { pedido: p?p[1]:null, placa:null, usina:null };
      } }
  ];
  // Fallback genérico: quando nenhuma regra de fornecedor bate (ex: notas
  // internas entre filiais, fábrica própria), tenta pelo menos achar uma
  // placa "com cara de placa" solta no texto — sem isso, a nota some pra
  // conferência manual mesmo (não tem como adivinhar).
  var RE_PLACA_GENERICA = /\b([A-Z]{3}[0-9][A-Z0-9][0-9]{2})\b/;
  function extractFromDescricao(fornecedorNome, descricao){
    descricao = String(descricao || "");
    var regra = SEFAZ_PARSERS.find(function(r){ return r.match.test(fornecedorNome || ""); });
    var out = regra ? regra.extract(descricao) : {pedido:null, placa:null, usina:null};
    if (!out.placa){
      var g = RE_PLACA_GENERICA.exec(descricao.toUpperCase());
      if (g) out.placa = g[1];
    }
    // Camada extra, independente do fornecedor: se o texto trouxer um CNPJ
    // que bate com uma usina cadastrada (Base de Usinas), isso é um sinal
    // mais confiável que o "achar nome de cidade no endereço" — sobrescreve
    // a usina encontrada pela regra do fornecedor quando há um match de CNPJ.
    // Se o CNPJ encontrado no texto não pertencer a nenhuma usina cadastrada
    // (ex.: é o CNPJ da transportadora, não o nosso), simplesmente não bate
    // com nada em usinasCadastro e out.usina não é alterado — seguro por
    // construção, não precisa distinguir "é nosso CNPJ" de "é de terceiro".
    var cnpjAchado = cnpjEmTexto(descricao);
    if (cnpjAchado){
      var usinaPorCnpj = usinaByCnpj(cnpjAchado);
      if (usinaPorCnpj) out.usina = usinaPorCnpj;
    }
    return out;
  }

  // Base de Usinas (filiais Concrelagos) — Usina, código/sigla internos, CNPJ
  // (raiz+filial) e regional responsável. Veio do cadastro oficial que você
  // enviou (base_cadastro_filiais.xlsx). "usina" já está alinhado com o nome
  // usado no resto do sistema (MASTER_USINAS) quando havia correspondência
  // clara; "nomeCadastro" guarda o nome original da planilha, caso divirja
  // (ex.: "SÃO PEDRO DA ALDEIA" no cadastro = "SÃO PEDRO" no resto do app).
  // É essa base que permite reconhecer a usina de descarga pelo CNPJ dentro
  // do texto livre das notas do SEFAZ (função cnpjEmTexto/usinaByCnpj abaixo).
  var usinasCadastro = [];

  function normalizeCnpj(s){ return String(s||"").replace(/\D/g, ""); }
  function usinaByCnpj(cnpj){
    var alvo = normalizeCnpj(cnpj);
    if (!alvo) return null;
    var found = usinasCadastro.find(function(u){ return normalizeCnpj(u.cnpj) === alvo; });
    return found ? found.usina : null;
  }
  // Acha um trecho com "cara de CNPJ" (formatado ou não) dentro de um texto
  // livre — usado pra varrer a Descrição Complementar das notas do SEFAZ.
  var RE_CNPJ = /(\d{2}[.\s]?\d{3}[.\s]?\d{3}[\s\/]?\d{4}-?\d{2})/;
  function cnpjEmTexto(texto){
    var m = RE_CNPJ.exec(String(texto || ""));
    return m ? m[1] : null;
  }

  var nfSeq = 0;
    var cementNFes = [];
  function nfKey(nf){ return String(nf.numero||"").trim().toUpperCase(); }

  // ---- Lançamentos (PUZL) — RESUMO DE ENTRADAS ----
  // Exportação real da PUZL (RESUMO_DE_ENTRADAS_50.xlsx que você mandou): tem
  // as mesmas notas do SEFAZ (o nº da nota é a coluna DOCUMENTO), mas o
  // material vem num campo próprio (ITEM) bem mais limpo — é lá que a
  // pozolana aparece de forma clara ("POZOLANA", "POZOLANA PLX"), em vez de
  // precisar adivinhar pelo texto corrido do SEFAZ. Por isso essa importação
  // serve como uma 2ª fonte pra confirmar/completar o material de uma nota:
  // ver puzlMatchParaNF/materialEfetivo, usados tanto na importação do SEFAZ
  // (2º critério pra aceitar uma nota como cimento) quanto na exibição do
  // Controle de Pedidos e no alerta de material novo. Campos financeiros da
